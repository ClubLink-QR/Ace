/* ---- new rotation draft ---- */
let draft = null;
function sheetNewRot(tableId){
  draft = {
    tableId: tableId || (state.tables.find(t=>t.status==="empty")||state.tables[0]||{}).id || null,
    guests: 1, minutes: state.defaultMin, perRound: 1, order: [],
    firstFee: state.fees.firstHigh      // 初回料金
  };
  renderNewRot();
}
function renderNewRot(){
  const d = draft;
  const usable = state.tables.filter(t=>t.status==="empty" || t.status==="serving");
  if(!usable.some(t=>t.id===d.tableId)) d.tableId = usable.length ? usable[0].id : null;
  const opts = usable.map(t=>`<option value="${t.id}" ${t.id===d.tableId?"selected":""}>
      ${esc(t.name)}（${S[t.status].label}）</option>`).join("");
  const avail = state.casts.filter(c=>c.active);
  const picks = avail.map(c=>{
    const i = d.order.indexOf(c.id);
    return `<button data-pick="${c.id}" aria-pressed="${i>=0}">${esc(c.name)}${i>=0?`<span class="idx">${i+1}</span>`:""}</button>`;
  }).join("");
  const ord = d.order.map((cid,i)=>`<div class="ordrow"><span class="no">${i+1}</span>
      <span class="nm">${esc(castName(cid))}</span>
      <button data-mv="${i}:-1" ${i===0?"disabled":""}>↑</button>
      <button data-mv="${i}:1" ${i===d.order.length-1?"disabled":""}>↓</button>
      <button data-rm="${i}">✕</button></div>`).join("");
  const nR = Math.ceil(d.order.length / d.perRound) || 0;

  openSheet(`<h3>初回回しを始める<small>ORDER OF ROTATION</small></h3>
    <div class="field"><label>テーブル</label>
      <select class="inp" data-dtable="1" ${usable.length?"":"disabled"}>
        ${opts||`<option>使える卓がありません</option>`}</select>
      ${usable.length?"":`<p class="note">空席または接客中の卓がありません。バッシング完了で空席に戻してください。</p>`}</div>

    <div class="field"><label>初回料金</label>
      <div class="quick">
        <button data-dfee="${state.fees.firstHigh}" aria-pressed="${d.firstFee===state.fees.firstHigh}">${yen(state.fees.firstHigh)}</button>
        <button data-dfee="${state.fees.firstLow}" aria-pressed="${d.firstFee===state.fees.firstLow}">${yen(state.fees.firstLow)}</button>
      </div>
      <p class="round-hint">${yen(d.firstFee)} × ${d.guests}名 ＝ <b>${yen(d.firstFee*d.guests)}</b></p>
      <p class="round-hint">初回料金を設定すると、この卓のセット料金と指名料は自動でオフになります（あとから卓のメニューで戻せます）。</p></div>

    <div class="field"><label>来店人数</label>
      <div class="stepper"><button data-dguest="-1">−</button>
        <div class="val">${d.guests}<small>名</small></div>
        <button data-dguest="1">＋</button></div></div>

    <div class="field"><label>1組あたりの時間</label>
      <div class="stepper"><button data-dmin2="-1">−</button>
        <div class="val">${d.minutes}<small>分</small></div>
        <button data-dmin2="1">＋</button></div>
      <div class="quick">${[5,10,15,20].map(n=>`<button data-dminset="${n}" aria-pressed="${d.minutes===n}">${n}分</button>`).join("")}</div></div>

    <div class="field"><label>同時に付けるキャスト数</label>
      <div class="stepper"><button data-dper="-1">−</button>
        <div class="val">${d.perRound}<small>名ずつ</small></div>
        <button data-dper="1">＋</button></div></div>

    <div class="field"><label>付ける順番（タップした順）</label>
      <div class="castpick">${picks || `<span class="note">出勤中のキャストがいません。設定から追加してください。</span>`}</div>
      ${d.order.length?`<div class="ordlist">${ord}</div>`:""}
      <p class="round-hint">${d.order.length
        ? `全 <b>${nR}組</b> ／ 所要 <b>約${nR*d.minutes}分</b>（${hhmm(Date.now())} 開始 → ${hhmm(Date.now()+nR*d.minutes*60000)} 終了予定）`
        : `キャストをタップすると回す順番が決まります。`}</p></div>

    <div class="sheet-acts">
      <button class="btn gh" data-closesheet="1">やめる</button>
      <button class="btn pri" data-startrot="1" ${d.order.length&&d.tableId?"":"disabled"}>開始する</button>
    </div>`);
}

/* ========== events ========== */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-brange],[data-resetsales],[data-mcat],[data-newcode],[data-synctest],[data-btab],[data-obill],[data-receipt],[data-srange],[data-ptrack],[data-tcast],[data-persist],[data-firstoff],[data-dfee],[data-sec],[data-cat],[data-catadd],[data-catdel],[data-kdone],[data-kundo],[data-pstock],[data-feeon],[data-feetog],[data-idle],[data-okconfirm],[data-dev],[data-devclose],[data-devset],[data-tcancel],[data-tbus],[data-tstart],[data-thome],[data-ttab],[data-cadd],[data-cqty],[data-confirm],[data-cclear],[data-tbill],[data-key],[data-acct],[data-logout],[data-otab],[data-addacct],[data-adel],[data-tab],[data-filter],[data-table],[data-closesheet],[data-go],[data-guest],[data-new-rot],[data-order],[data-qty],[data-addprod],[data-pdel],[data-goto-rot],[data-next-rot],[data-pause-rot],[data-extend-rot],[data-close-rot],[data-restart-rot],[data-tcount],[data-tset],[data-dmin],[data-addcast],[data-delcast],[data-ctog],[data-deltable],[data-reset],[data-pick],[data-mv],[data-rm],[data-dguest],[data-dmin2],[data-dminset],[data-dper],[data-startrot]");
  if(!el){
    if(e.target.dataset && e.target.dataset.sheet) closeSheet();
    return;
  }
  const d = el.dataset;

  if(d.okconfirm){
    const f = pendingAction; pendingAction = null;
    $("#sheetHost").innerHTML = "";
    if(f) f();
    return;
  }

  /* order terminal */
  if(d.dev){ devPin=""; devErr=""; devAuthed=false; sheetDevice(); return; }
  if(d.devclose){ devPin=""; devErr=""; devAuthed=false; closeSheet(); return; }
  if(d.devset){
    state.deviceTable = d.devset;
    state.term = { stage:"idle", tab:"menu", cat:"*" };
    devPin=""; devErr=""; devAuthed=false;
    closeSheet(); commit(); toast(`${tableOf(d.devset).name} 卓に設定しました`); return;
  }
  if(d.tstart){
    const t = state.deviceTable ? tableOf(state.deviceTable) : null;
    /* 空席のときは、画面に触れただけで時間が始まらないよう必ず確認を挟む */
    if(t && t.status === "empty"){
      askConfirm({
        title: "ご案内を開始しますか？",
        ok: "開始する",
        msg: `${esc(t.name)}卓の<b>入店時刻を記録</b>し、セット料金 ${yen(state.fees.setBase)}`
           + `${state.fees.nom ? ` と指名料 ${yen(state.fees.nom)}` : ""} が発生します。`,
        run: ()=>{
          go(t, "serving");
          state.term = {stage:"active", tab:"menu", cat:state.term.cat||"*"};
          window.scrollTo(0,0); commit();
          toast(`${hhmm(t.seatedAt)} 入店`);
        }
      });
      return;
    }
    state.term = {stage:"active", tab:"menu", cat:state.term.cat||"*"}; window.scrollTo(0,0); commit(); return;
  }
  if(d.thome){ state.term.stage = "idle"; window.scrollTo(0,0); render(); return; }
  if(d.ttab){ state.term.tab = d.ttab; window.scrollTo(0,0); render(); return; }
  if(d.mcat){ state.term.cat = d.mcat; window.scrollTo(0,0); render(); return; }
  if(d.cadd){ const [tid,pid] = d.cadd.split(":"); cartAdd(tid,pid,1); commit(); return; }
  if(d.cqty){ const [tid,pid,dv] = d.cqty.split(":"); cartAdd(tid,pid,Number(dv)); commit(); return; }
  if(d.cclear){
    const tid = d.cclear;
    if(!cartOf(tid).length) return;
    askConfirm({ title:"カートを空にしますか？", ok:"空にする", danger:true,
      msg:"まだ確定していない注文がすべて取り消されます。",
      run:()=>{ state.cart[tid] = []; commit(); } });
    return;
  }
  if(d.confirm){
    const n = cartCount(d.confirm), amt = cartTotal(d.confirm);
    if(!cartConfirm(d.confirm)) return;
    if(roleOf() === "order") state.term.tab = "menu";   // 端末は待機画面に戻さず続けて注文できるように
    window.scrollTo(0,0); commit();
    toast(`注文を確定しました（${n}点 ${yen(amt)}）`); return;
  }
  if(d.tbill){
    const tid = d.tbill, t = tableOf(tid);
    askConfirm({ title:"会計に進みます", ok:"会計をお願いする",
      msg:`合計 <b style="color:var(--gold);font-family:var(--mono)">${yen(billTotal(t))}</b><br>これ以降このテーブルからは注文できなくなります。`,
      run:()=>{ go(t,"billing"); state.term = {stage:"idle", tab:"menu", cat:"*"}; window.scrollTo(0,0); commit(); } });
    return;
  }
  if(d.tcancel){
    const t = tableOf(d.tcancel);
    go(t,"serving"); state.term = {stage:"idle", tab:"menu", cat:"*"}; commit();
    toast("会計をキャンセルしました"); return;
  }
  if(d.tbus){
    const t = tableOf(d.tbus);
    go(t,"empty"); state.term = {stage:"idle", tab:"menu", cat:"*"}; commit();
    toast("バッシング完了：空席に戻しました"); return;
  }

  /* login */
  if(d.key){
    const k = d.key;
    if(k === "del")      state.pin = state.pin.slice(0,-1);
    else if(k === "clr") state.pin = "";
    else if(state.pin.length < 4) state.pin += k;
    state.pinErr = "";
    if(state.pin.length === 4){
      const a = state.accounts.find(x => x.pin === state.pin);
      state.pin = "";
      if(a){
        state.session = a.id;
        state.tab = ROLES[a.role].tabs[0];
        state.orderTable = null;
        state.term = { stage:"idle", tab:"menu", cat:"*" };
        restartPolling();
        commit(); toast(`${a.name}（${ROLES[a.role].label}）でログインしました`);
      } else {
        state.pinErr = "PINが違います";
        commit();
        const c = document.querySelector(".login-card");
        if(c){ c.classList.add("shake"); setTimeout(()=>c.classList.remove("shake"), 400); }
      }
      return;
    }
    commit(); return;
  }
  if(d.acct){ sheetAccount(); return; }
  if(d.logout){ logoutPin = ""; logoutErr = ""; sheetLogout(); return; }

  if(d.tab){ state.tab = d.tab; state.filter="all"; render(); return; }
  if(d.filter){ state.filter = d.filter; render(); return; }
  if(d.table){ sheetTable(d.table); return; }
  if(d.receipt){ state.billTable = d.receipt; state.tab = "bill"; closeSheet(); window.scrollTo(0,0); render(); return; }
  if(d.closesheet){ closeSheet(); return; }

  /* table sheet */
  if(d.go){
    const [id,k] = d.go.split(":"); const t = tableOf(id);
    if(k === "closed" && !can("manage")){ toast("会計完了はホール・管理者が行います"); return; }
    const inSheet = !!$("#sheetHost").firstElementChild;
    go(t,k); commit();
    if(inSheet){ if(k==="empty" || k==="closed") closeSheet(); else sheetTable(id); }
    return;
  }
  if(d.guest){
    const [id,dv] = d.guest.split(":"); const t = tableOf(id);
    t.guests = Math.max(0, Math.min(30, t.guests + Number(dv)));
    sheetTable(id); commit(); return;
  }
  if(d.firstoff){
    const t = tableOf(d.firstoff);
    t.firstFee = null; t.fees.set = true; t.fees.nom = true;
    sheetTable(t.id); commit(); toast("初回料金を解除しました"); return;
  }
  if(d.tcast){
    const [id,cid] = d.tcast.split(":"); const t = tableOf(id);
    if(!t.casts) t.casts = [];
    t.casts = t.casts.includes(cid) ? t.casts.filter(x=>x!==cid) : t.casts.concat(cid);
    sheetTable(id); commit(); return;
  }
  if(d.feetog){
    const [id,key] = d.feetog.split(":"); const t = tableOf(id);
    t.fees[key] = !t.fees[key];
    sheetTable(id); commit(); return;
  }
  if(d.idle){
    state.idleSec = Math.max(10, Math.min(600, state.idleSec + Number(d.idle)));
    commit(); return;
  }

  /* order */
  if(d.order){
    if(!can("order")){ sheetBill(d.order); return; }
    state.orderTable = d.order; state.tab = "order"; closeSheet(); window.scrollTo(0,0); commit(); return;
  }
  if(d.otab){ state.orderTable = d.otab; commit(); return; }
  if(d.qty){ const [tid,lid,dv] = d.qty.split(":"); setQty(tid,lid,Number(dv)); commit(); return; }

  /* accounts */
  if(d.addacct){
    state.accounts.push({ id:uid(), name:"新しいアカウント", role:"order", pin:"" });
    commit(); return;
  }
  if(d.adel){
    if(d.adel === state.session){ toast("ログイン中のアカウントは削除できません"); return; }
    const rest = state.accounts.filter(a=>a.id!==d.adel);
    if(!rest.some(a=>a.role==="manager")){ toast("管理者を1人以上残してください"); return; }
    state.accounts = rest; commit(); return;
  }

  /* kitchen */
  if(d.kdone){ const f = findBatch(d.kdone); if(f){ f.b.done = true; state.rev++; commit(); } return; }
  if(d.kundo){ const f = findBatch(d.kundo); if(f){ f.b.done = false; state.rev++; commit(); } return; }

  /* stock */
  if(d.ptrack){
    const p = prodOf(d.ptrack);
    if(p){ p.track = !p.track; if(p.track && p.stock <= 0) p.stock = 10; }
    commit(); return;
  }
  if(d.pstock){
    const [pid,dv] = d.pstock.split(":"); const p = prodOf(pid);
    if(p) p.stock = Math.max(0, p.stock + Number(dv));
    commit(); return;
  }

  /* sections / categories */
  if(d.btab){ state.billTable = d.btab; window.scrollTo(0,0); render(); return; }
  if(d.obill){ state.openBill = (state.openBill === d.obill) ? null : d.obill; render(); return; }
  if(d.synctest){ testSync(); return; }
  if(d.newcode){ createStoreCode(); return; }
  if(d.sec){ state.openSecs[d.sec] = !state.openSecs[d.sec]; render(); return; }
  if(d.srange){ applyRangePreset("salesRange", "salesAuto", d.srange); render(); return; }
  if(d.brange){ applyRangePreset("billRange", "billAuto", d.brange); render(); return; }
  if(d.cat){ state.openCats[d.cat] = !state.openCats[d.cat]; render(); return; }
  if(d.catadd){
    const n = newCat.trim();
    if(!n){ toast("ジャンル名を入力してください"); return; }
    if(state.categories.includes(n)){ toast("同じ名前のジャンルがあります"); return; }
    state.categories.push(n); newCat = ""; state.openCats[n] = true; commit(); return;
  }
  if(d.catdel){
    const i = Number(d.catdel), name = state.categories[i];
    const rest = state.categories.filter((_,x)=>x!==i);
    const moveTo = rest[0] || "未分類";
    askConfirm({ title:`「${name}」を削除しますか？`, ok:"削除する", danger:true,
      msg:`このジャンルの商品 ${state.products.filter(p=>p.cat===name).length} 件は「${moveTo}」へ移動します。`,
      run:()=>{
        state.products.forEach(p=>{ if(p.cat===name) p.cat = moveTo; });
        state.categories = rest; delete state.openCats[name]; commit();
      }});
    return;
  }

  /* products */
  if(d.addprod){
    const cat = (d.addprod === "1") ? (state.categories[0] || "未分類") : d.addprod;
    state.products.push({ id:uid(), name:"新しい商品", price:0, cat, stock:10, track:false });
    state.openCats[cat] = true; commit(); return;
  }
  if(d.pdel){
    state.products = state.products.filter(p=>p.id!==d.pdel); commit(); return;
  }
  if(d.pmv){ /* 廃止：ドラッグ並べ替えに統一（reorderProducts が担当） */ return; }
  if(d.feeon){
    state.fees[d.feeon] = !state.fees[d.feeon]; commit(); return;
  }

  /* rotation */
  if(d.newRot){ sheetNewRot(d.newRot==="1"?null:d.newRot); return; }
  if(d.gotoRot){ closeSheet(); state.tab="first"; render(); return; }
  if(d.nextRot){ advance(state.rotations.find(r=>r.id===d.nextRot)); return; }
  if(d.pauseRot){
    const r = state.rotations.find(x=>x.id===d.pauseRot);
    if(r.runningSince){ r.elapsedMs += Date.now()-r.runningSince; r.runningSince=null; }
    else r.runningSince = Date.now();
    commit(); return;
  }
  if(d.extendRot){
    const r = state.rotations.find(x=>x.id===d.extendRot);
    r.elapsedMs -= 60000; commit(); toast("1分延長しました"); return;
  }
  if(d.closeRot){
    const r = state.rotations.find(x=>x.id===d.closeRot);
    r.closed = true; commit(); toast("初回回しを終了しました"); return;
  }
  if(d.restartRot){
    const r = state.rotations.find(x=>x.id===d.restartRot);
    r.done=false; r.index=0; r.elapsedMs=0; r.runningSince=Date.now(); r.startedAt=Date.now();
    commit(); return;
  }

  /* new rotation draft */
  if(d.pick){
    const i = draft.order.indexOf(d.pick);
    if(i>=0) draft.order.splice(i,1); else draft.order.push(d.pick);
    renderNewRot(); return;
  }
  if(d.mv){
    const [i,dv] = d.mv.split(":").map(Number); const j = i+dv;
    if(j>=0 && j<draft.order.length){ const a=draft.order; [a[i],a[j]]=[a[j],a[i]]; }
    renderNewRot(); return;
  }
  if(d.rm){ draft.order.splice(Number(d.rm),1); renderNewRot(); return; }
  if(d.dguest){
    draft.guests = Math.max(1, Math.min(12, draft.guests + Number(d.dguest)));
    draft.perRound = Math.max(1, Math.min(draft.guests, draft.perRound));
    renderNewRot(); return;
  }
  if(d.dmin2){ draft.minutes = Math.max(1, Math.min(60, draft.minutes + Number(d.dmin2))); renderNewRot(); return; }
  if(d.dminset){ draft.minutes = Number(d.dminset); renderNewRot(); return; }
  if(d.dfee !== undefined){ draft.firstFee = Number(d.dfee); renderNewRot(); return; }
  if(d.dper){ draft.perRound = Math.max(1, Math.min(6, draft.perRound + Number(d.dper))); renderNewRot(); return; }
  if(d.startrot){ startRotation(); return; }

  /* settings */
  if(d.tcount){ changeTableCount(state.tables.length + Number(d.tcount)); return; }
  if(d.tset){ changeTableCount(Number(d.tset)); return; }
  if(d.dmin){ state.defaultMin = Math.max(1, Math.min(60, state.defaultMin + Number(d.dmin))); commit(); return; }
  if(d.addcast){ state.casts.push({id:uid(), name:`キャスト${state.casts.length+1}`, active:true}); commit(); return; }
  if(d.delcast){ state.casts = state.casts.filter(c=>c.id!==d.delcast); commit(); return; }
  if(d.ctog){ const c = state.casts.find(x=>x.id===d.ctog); c.active = !c.active; commit(); return; }
  if(d.deltable){
    const t = tableOf(d.deltable);
    if(t.status!=="empty"){ toast("使用中の卓は削除できません"); return; }
    delete state.orders[t.id]; delete state.cart[t.id];
    state.accounts.forEach(a=>{ if(a.tableId===t.id) a.tableId = null; });
    state.tables = state.tables.filter(x=>x.id!==d.deltable); commit(); return;
  }
  if(d.reset){
    askConfirm({ title:"営業リセットしますか？", ok:"リセットする", danger:true,
      msg:"テーブルの状態・伝票・初回回しがすべて空になります。商品・キャスト・アカウント・売上データは残ります。",
      run:()=>{
        state.tables.forEach(t=>{
          t.status="empty"; t.guests=0; t.seatedAt=null; t.billedAt=null; t.firstFee=null;
          t.casts=[]; t.customerName=""; t.fees={ set:true, nom:true, douhan:false }; t.statusSince=Date.now();
        });
        state.rotations = []; state.orders = {}; state.cart = {}; state.orderTable = null; state.billTable = null;
        state.term = { stage:"idle", tab:"menu", cat:"*" };
        commit(); toast("営業リセットしました");
      } });
    return;
  }
  if(d.resetsales){
    askConfirm({ title:"売上データを消去しますか？", ok:"消去する", danger:true,
      msg:"これまでの会計履歴（売上タブの集計・キャスト別成績）が<b>すべて</b>消えます。元に戻せません。",
      run:()=>{
        state.billHistory = []; state.salesRange = { from: todayStr(), to: todayStr() };
        commit(); toast("売上データを消去しました");
      } });
    return;
  }
});

let inputTimer = null;
function commitSoft(){                     // 入力中は再描画せず配信だけ遅らせて行う
  clearTimeout(inputTimer);
  inputTimer = setTimeout(()=>{ send(); saveLocal(); pushCloud(); pushRemote(); }, 400);
}
document.addEventListener("input", e=>{

     t.dataset.fee||t.dataset.pstocknum||t.dataset.catname||t.dataset.aname||t.dataset.apin||
     t.dataset.cust||t.dataset.logoutpw)) commitSoft();
  if(t.dataset.logoutpin){
    logoutPin = t.value.replace(/[^0-9]/g,"").slice(0,8);

    const want = String(state.logoutPin || "1234");
    if(logoutPin.length >= want.length){
      if(logoutPin === want){

        state.session = null; state.pin = ""; state.pinErr = "";
        closeSheet(); render();

      }
      logoutErr = "パスワードが違います"; logoutPin = "";
      sheetLogout();

  if(t.dataset.devpin){

    t.value = devPin; devErr = "";
    if(devPin.length === 4){
      if(state.accounts.some(a=>a.role==="manager" && a.pin===devPin)){
        devAuthed = true; devPin = "";

  if(t.id==="setShop"){ state.shopName = t.value; $("#shopName").textContent = t.value||"店舗管理"; return; }
  if(t.dataset.tname){ tableOf(t.dataset.tname).name = t.value; return; }
  if(t.dataset.cust){
    if(!can("manage")) return;
    const tb = tableOf(t.dataset.cust); if(tb) tb.customerName = t.value;
    return;
  }
  if(t.dataset.cname){ const c=state.casts.find(x=>x.id===t.dataset.cname); if(c) c.name=t.value; return; }
  if(t.dataset.pname){ const p=prodOf(t.dataset.pname); if(p) p.name=t.value; return; }
  if(t.dataset.pabbr){ const p=prodOf(t.dataset.pabbr); if(p) p.abbr=t.value; return; }
  if(t.dataset.pprice){
    const p=prodOf(t.dataset.pprice);
    if(p) p.price = Math.max(0, parseInt(t.value,10) || 0);
    return;
  }
  if(t.dataset.fee){
    const k = t.dataset.fee;
    const max = (k==="service" || k==="tax") ? 100 : 9999999;
    state.fees[k] = Math.min(max, Math.max(0, parseInt(t.value,10) || 0));
    return;
  }
  if(t.dataset.newcat !== undefined){ newCat = t.value; return; }
  if(t.dataset.catname !== undefined){
    const i = Number(t.dataset.catname), old = state.categories[i], nv = t.value;
    state.categories[i] = nv;
    state.products.forEach(p=>{ if(p.cat === old) p.cat = nv; });
    if(state.openCats[old]){ delete state.openCats[old]; state.openCats[nv] = true; }
    return;
  }
  if(t.dataset.pstocknum){
    const p = prodOf(t.dataset.pstocknum);
    if(p){ p.stock = Math.max(0, parseInt(t.value,10) || 0); }
    return;
  }
  if(t.dataset.aname){ const a=state.accounts.find(x=>x.id===t.dataset.aname); if(a) a.name=t.value; return; }
  if(t.dataset.logoutpw !== undefined){
    state.logoutPin = t.value.replace(/[^0-9]/g,"").slice(0,8);
    t.value = state.logoutPin; return;
  }
  if(t.dataset.syncurl !== undefined){ state.syncUrl = t.value; return; }     // 確定はblur(change)側で行う
  if(t.dataset.storecode !== undefined){ state.storeCode = t.value; return; } // 同上
  if(t.dataset.apin){

    if(a){ a.pin = t.value.replace(/[^0-9]/g,"").slice(0,4); t.value = a.pin; }
    return;
  }
});

/* ========== actions ========== */
/* 空席 →接客開始→ 接客中 →会計→ 会計待ち →会計完了→ 使用不可 →バッシング完了→ 空席 */
const GO_MSG = { serving:"接客中", billing:"会計待ち", closed:"使用不可（片付け待ち）", empty:"空席" };
function go(t, k){
  if(t.status === k) return;
  if(k === "serving"){
    if(!t.seatedAt) t.seatedAt = Date.now();   // 入店時刻
    t.billedAt = null;                          // 会計をキャンセルしたらセット料金の計測を再開
    if(t.guests === 0) t.guests = 1;
  }
  if(k === "billing"){
    t.billedAt = Date.now();                    // ここでセット料金が確定
    const r = rotOf(t.id); if(r) r.closed = true;   // 会計に進んだら初回回しは終了
  }
  if(k === "closed"){
    const b = bill(t);                          // ここで確定した金額を売上として記録する
    state.billHistory.push({
      id: uid(), at: Date.now(),
      tableName: t.name, customerName: t.customerName || "",
      guests: t.guests, casts: (t.casts||[]).map(castName),
      isFirst: b.isFirst, nom: !!t.fees.nom, douhan: !!t.fees.douhan,
      seatedAt: t.seatedAt, billedAt: t.billedAt,
      sub: b.sub, svc: b.svc, tax: b.tax, total: b.total,
      svcRate: state.fees.serviceOn ? state.fees.service : 0,
      taxRate: state.fees.taxOn ? state.fees.tax : 0,
      orderCount: orderCount(t.id),
      feeLines: feeLines(t).map(l=>({ name:l.name, note:l.note||"", amount:l.amount })),
      orderLines: allLines(t.id).map(l=>({ name:l.name, abbr:l.abbr||"", price:l.price, qty:l.qty }))
    });
  }
  if(k === "empty"){
    const r = rotOf(t.id); if(r) r.closed = true;
    delete state.orders[t.id];        // バッシング完了で伝票をリセット
    delete state.cart[t.id];
    t.guests = 0; t.seatedAt = null; t.billedAt = null; t.firstFee = null; t.casts = []; t.customerName = "";
    t.fees = { set:true, nom:true, douhan:false };
  }
  t.status = k; t.statusSince = Date.now();
  toast(`${t.name} → ${GO_MSG[k]}`);
}

function changeTableCount(n){
  n = Math.max(1, Math.min(60, n));
  const cur = state.tables.length;
  if(n > cur){
    for(let i=cur;i<n;i++) state.tables.push(mkTable(i+1));
  } else if(n < cur){
    for(let i=cur;i>n;i--){
      const last = state.tables[state.tables.length-1];
      if(last.status!=="empty"){ toast("使用中の卓があるため減らせません"); break; }
      state.tables.pop();
    }
  }
  render();
}

function startRotation(){
  const d = draft;
  const t = tableOf(d.tableId); if(!t || !d.order.length) return;
  const old = rotOf(t.id); if(old) old.closed = true;
  state.rotations.unshift({
    id: uid(), tableId: t.id, guests: d.guests, minutes: d.minutes, perRound: d.perRound,
    order: d.order.slice(), index: 0, startedAt: Date.now(),
    elapsedMs: 0, runningSince: Date.now(), done:false, closed:false
  });
  if(t.status !== "serving") go(t,"serving");
  t.guests = d.guests;
  t.firstFee = d.firstFee;                      // 初回料金を確定
  t.fees.set = false; t.fees.nom = false;       // 初回はこの料金のみ
  closeSheet(); state.tab = "first"; render();
  toast(`${t.name} の初回回しを開始しました`);
}

let lastRev = -1;

/* ==========================================================
   連携（同期）
   ・BroadcastChannel で「同じブラウザで開いている別タブ／別ウィンドウ」と即時同期します。
   ・window.storage（共有ストレージ）が使える環境では、それを使って
     「別端末・別ブラウザ」とも数秒おきに同期します。これは Claude 上でこの
     アプリを開いた場合にだけ使えるAPIです。単体のHTMLファイルとしてダウン
     ロードし、各タブレットのブラウザで file:// や自前のサーバーから直接開い
     た場合は使えません（その場合は各端末が独立して動きます）。
     ・本当に「タブレット14台がリアルタイムで連携する」運用にするには、
     window.storage が使える形で配信するか、専用のサーバー（Firebase／
     WebSocketなど）を用意する必要があります。
   ・PERSIST を true にすると、この端末のブラウザに保存して再読み込み後も残ります。
   ========================================================== */
const PERSIST = true;                  // 端末のブラウザに保存し、再読み込み後も残す
const SYNC_KEY = "store-manager-v1";
const CLOUD_KEY = "state";             // window.storage 上のキー
const CLIENT_ID = uid();
/* cart（確定前のカート）は端末ごとのものなので同期しない。
   同期すると、確定してカートを空にした直後に他端末の古いカートが戻ってきてしまう。 */
const SHARED = ["shopName","tables","casts","categories","products","accounts",
                "orders","fees","rotations","defaultMin","idleSec","rev","billHistory","logoutPin"];

const CLOUD = !!(typeof window !== "undefined" && window.storage &&
               typeof window.storage.get === "function");   // 端末をまたぐ同期が使えるか

let chan = null, applying = false, syncTimer = null, cloudRev = 0, cloudTimer = null;
try { chan = new BroadcastChannel(SYNC_KEY); } catch(e) { chan = null; }

const snapshot = () => { const o = {}; SHARED.forEach(k=>o[k] = state[k]); return o; };

function send(){
  if(!chan || applying) return;
  try { chan.postMessage({ from:CLIENT_ID, at:Date.now(), data:JSON.parse(JSON.stringify(snapshot())) }); }
  catch(e){}
}
function saveLocal(){
  if(!PERSIST) return;
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(snapshot())); } catch(e){}
}
function loadLocal(){
  if(!PERSIST) return false;
  try {
    const raw = localStorage.getItem(SYNC_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    SHARED.forEach(k=>{ if(d[k] !== undefined) state[k] = d[k]; });
    return true;
  } catch(e){ return false; }
}
function applyRemote(d){
  applying = true;
  SHARED.forEach(k=>{ if(d[k] !== undefined) state[k] = d[k]; });
  applying = false;
  if(state.deviceTable && !tableOf(state.deviceTable)) state.deviceTable = null;
  render();
}
if(chan){
  chan.onmessage = e=>{
    const m = e.data;
    if(!m || m.from === CLIENT_ID) return;
    if(m.hello){ send(); return; }          // 後から開いたタブに現在の状態を渡す
    applyRemote(m.data);
  };
}

/* ---- 端末をまたぐ同期（window.storage が使える場合のみ動く） ---- */
async function pushCloud(){
  if(!CLOUD) return;
  try{
    cloudRev++;
    const payload = JSON.stringify({ from:CLIENT_ID, rev:cloudRev, at:Date.now(), data:snapshot() });
    await window.storage.set(CLOUD_KEY, payload, true);   // shared:true = 全端末で共有
  } catch(e){ /* 送れなくても致命的ではないので黙って諦める */ }
}
async function pullCloud(){
  if(!CLOUD) return;
  try{
    const res = await window.storage.get(CLOUD_KEY, true);
    if(!res || !res.value) return;
    const m = JSON.parse(res.value);
    if(!m || m.from === CLIENT_ID || m.rev === cloudRev) return;
    cloudRev = m.rev;
    applyRemote(m.data);
  } catch(e){ /* まだ何も保存されていない場合はここに来る */ }
}
if(CLOUD){
  pullCloud().then(()=>{ if(!state.billHistory) state.billHistory = []; render(); });
  cloudTimer = setInterval(pullCloud, 4000);   // 4秒おきに他端末の更新を取り込む
}

/* ---- 外部URLを使った同期 ----------------------------------------
   URLの種類を見て、自動的に方式を切り替えます。

   (A) Firebase Realtime Database（おすすめ・自分でサーバーを建てない）
       URL例: https://〇〇-default-rtdb.firebasedatabase.app/店の合言葉/store.json
       書き込み = PUT、読み取り = EventSource による本物のリアルタイム受信。
       GitHub Pages などに置いた場合でも、どこからでも同期します。

   (B) それ以外（Cloudflare Worker / 同梱の sync-server.js など）
       書き込み = POST、読み取り = 数秒おきの GET。
   ------------------------------------------------------------------ */
const SYNC_URL_KEY  = "store-manager-sync-url";
const CODE_KEY      = "store-manager-code";
/* 登録不要で使える公開の保管サービス。
   ブラウザから使えるかはサービス側の設定（CORS）次第なので、
   作成時に上から順に試して、成功したものを採用する。
   店舗コードは「サービスの記号 - 保管場所のID」の形になる。 */
const PROVIDERS = {
  kv: {
    name: "kvdb.io",
    url: id => `https://kvdb.io/${id}/state`,
    write: "PUT",
    async create(payload){
      const r = await fetch("https://kvdb.io/", {
        method:"POST", headers:{ "Content-Type":"application/json" }, body:"{}" });
      if(!r.ok) throw new Error(`作成を断られました（${r.status}）`);
      const bucket = (await r.text()).trim();
      if(!bucket || /\s/.test(bucket) || bucket.length > 80) throw new Error("IDを受け取れませんでした");
      const w = await fetch(`https://kvdb.io/${bucket}/state`, {
        method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) });
      if(!w.ok) throw new Error(`初期データの保存に失敗（${w.status}）`);
      return bucket;
    }
  },
  jb: {
    name: "jsonblob.com",
    url: id => `https://jsonblob.com/api/jsonBlob/${id}`,
    write: "PUT",
    async create(payload){
      const r = await fetch("https://jsonblob.com/api/jsonBlob", {
        method:"POST", headers:{ "Content-Type":"application/json", "Accept":"application/json" },
        body: JSON.stringify(payload) });
      if(!r.ok) throw new Error(`作成を断られました（${r.status}）`);
      const loc = r.headers.get("Location") || r.headers.get("location");
      if(!loc) throw new Error("IDを読み取れません（ブラウザの制限）");
      return loc.split("/").pop();
    }
  },
  js: {
    name: "jsonstorage.net",
    url: id => `https://api.jsonstorage.net/v1/json/${id}`,
    write: "PUT",
    async create(payload){
      const r = await fetch("https://api.jsonstorage.net/v1/json", {
        method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) });
      if(!r.ok) throw new Error(`作成を断られました（${r.status}）`);
      const j = await r.json().catch(()=>null);
      const uri = j && (j.uri || j.url);
      if(!uri) throw new Error("IDを受け取れませんでした");
      return String(uri).split("/").pop();
    }
  }
};
const PROVIDER_ORDER = ["kv","jb","js"];

/* 店舗コードを「サービス」と「ID」に分解する */
function parseCode(c){
  const t = (c || "").trim();
  if(!t) return null;
  const m = t.match(/^([a-zA-Z]{2})-(.+)$/);
  if(m && PROVIDERS[m[1].toLowerCase()]) return { p:m[1].toLowerCase(), id:m[2] };
  return { p:"jb", id:t };            // 記号なしは古い形式（jsonblob）とみなす
}

/* いま実際に使う接続先を決める（独自URLがあればそちら優先） */
function endpoint(){
  if(state.syncUrl) return state.syncUrl;
  const c = parseCode(state.storeCode);
  return c ? PROVIDERS[c.p].url(c.id) : "";
}
function codeWriteMethod(){
  const c = parseCode(state.storeCode);
  return c ? PROVIDERS[c.p].write : "PUT";
}
const writeMethod = () => state.syncUrl ? "POST" : codeWriteMethod();
const codeView = c => c || "";

/* 通信エラーを人に分かる言葉にする */
function netMsg(e){
  const m = (e && e.message) || "";
  if(/failed to fetch|networkerror|load failed|network request failed/i.test(m))
    return "ブラウザから接続できません（CORS制限またはネット未接続）";
  return m || "接続できません";
}
let remoteRev = 0, remoteTimer = null, es = null;
let lastStamp = "";        // 取り込み済みの記録（誰が・いつ書いたか）
let syncReady = false;     // 最初の取り込みが済むまで送信しない（他端末を空で上書きしないため）
try {
  const c = localStorage.getItem(CODE_KEY);
  if(c) state.storeCode = c;
  const u = localStorage.getItem(SYNC_URL_KEY);
  if(u !== null) state.syncUrl = u;
} catch(e){}

const isFirebase = u => /firebaseio\.com|firebasedatabase\.app/i.test(u || "");
function fbUrl(){
  let u = (state.syncUrl || "").trim().replace(/\/+$/, "");
  if(!/\.json(\?|$)/.test(u)) u += "/store.json";     // .json が無ければ足す
  return u;
}

/* 接続状況を画面に出すための記録 */
const syncState = { ok:null, msg:"未設定", lastOk:0, lastErr:"", detail:[] };

function syncNote(ok, msg){
  syncState.ok = ok;
  syncState.msg = msg;
  if(ok) syncState.lastOk = Date.now(); else syncState.lastErr = msg;
}

async function pushRemote(){
  if(!endpoint()) return;
  if(!syncReady) return;      // 先に相手の内容を取り込むまで送らない

  /* (0) 店舗コード：公開の保管サービスを更新する */
  if(!state.syncUrl && state.storeCode){
    try{
      remoteRev++;
      const res = await fetch(endpoint(), {
        method: codeWriteMethod(),
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ from:CLIENT_ID, rev:remoteRev, at:Date.now(), data:snapshot() })
      });
      if(res.ok) syncNote(true, "接続中");
      else if(res.status === 429) syncNote(false, "通信が多すぎます。少し待つと自動で戻ります");
      else if(res.status === 404) syncNote(false, "この店舗コードは見つかりません。作り直してください");
      else syncNote(false, `保存に失敗しました（${res.status}）`);
    } catch(e){ syncNote(false, netMsg(e)); }
    return;
  }

  /* (A) Firebase：まるごと PUT する */
  if(isFirebase(state.syncUrl)){
    try{
      remoteRev++;
      const res = await fetch(fbUrl(), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ from:CLIENT_ID, rev:remoteRev, at:Date.now(), data:snapshot() })
      });
      if(res.ok) syncNote(true, "接続中（リアルタイム）");
      else if(res.status === 401 || res.status === 403)
        syncNote(false, "書き込みを拒否されました。Firebaseのルールを確認してください");
      else syncNote(false, `サーバーがエラーを返しました（${res.status}）`);
    } catch(e){ syncNote(false, "サーバーに接続できません（URLと通信を確認）"); }
    return;
  }

  /* (B) それ以外：POST する */
  try{
    remoteRev++;
    const res = await fetch(state.syncUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ from:CLIENT_ID, rev:remoteRev, at:Date.now(), data:snapshot() })
    });
    if(res.ok) syncNote(true, "接続中");
    else syncNote(false, `サーバーがエラーを返しました（${res.status}）`);
  } catch(e){
    syncNote(false, "サーバーに接続できません（URL・通信・CORS設定を確認）");
  }
}

/* Firebase：変更があった瞬間に向こうから送られてくる（ポーリング不要） */
function startStream(){
  stopStream();
  if(!state.syncUrl || !isFirebase(state.syncUrl)) return;
  try{
    es = new EventSource(fbUrl());
  } catch(e){ syncNote(false, "リアルタイム接続を開始できませんでした"); return; }

  es.addEventListener("open", ()=>{ syncNote(true, "接続中（リアルタイム）"); render(); });

  const onData = ev=>{
    let m;
    try { m = JSON.parse(ev.data); } catch(e){ return; }
    if(!m) return;
    const wasOk = syncState.ok;
    syncNote(true, "接続中（リアルタイム）");
    // path が "/" のときは全体、それ以外は部分更新なので取り直す
    const rec = (m.path === "/" && m.data) ? m.data : null;
    if(!rec){ if(m.path && m.path !== "/") pullRemote(); else if(syncState.ok!==wasOk && state.session) render(); return; }
    syncReady = true;
    if(rec.from === CLIENT_ID){ if(syncState.ok!==wasOk && state.session) render(); return; }
    const st = (rec.at || 0) + ":" + (rec.from || "");
    if(st === lastStamp){ if(syncState.ok!==wasOk && state.session) render(); return; }
    lastStamp = st;
    remoteRev = rec.rev || remoteRev;
    if(rec.data) applyRemote(rec.data);
  };
  es.addEventListener("put", onData);
  es.addEventListener("patch", onData);

  es.addEventListener("error", ()=>{
    // EventSource は自動で再接続するので、状態だけ知らせる
    syncNote(false, "リアルタイム接続が切れました。再接続しています…");
  });
}
function stopStream(){ if(es){ try{ es.close(); }catch(e){} es = null; } }

async function pullRemote(){
  if(!endpoint()) return;
  const wasOk = syncState.ok;                          // 直前の接続状態（表示を更新すべきか判定するため）
  const url = state.syncUrl ? (isFirebase(state.syncUrl) ? fbUrl() : state.syncUrl) : endpoint();
  const paintIfChanged = ()=>{ if(syncState.ok !== wasOk && state.session) render(); };
  try{
    const res = await fetch(url, { cache:"no-store" });
    if(res.status === 429){ syncNote(false, "通信が多すぎます。少し待つと自動で戻ります"); paintIfChanged(); return; }
    if(res.status === 404 && !state.syncUrl){ syncNote(false, "この店舗コードは見つかりません。作り直してください"); paintIfChanged(); return; }
    if(!res.ok){ syncNote(false, `サーバーがエラーを返しました（${res.status}）`); paintIfChanged(); return; }
    const m = await res.json();
    syncNote(true, isFirebase(state.syncUrl) ? "接続中（リアルタイム）" : "接続中");

    // 相手にまだ何も無いなら、こちらの内容を最初の1件として送る
    if(!m || !m.data){
      syncReady = true;
      await pushRemote();
      paintIfChanged(); return;
    }
    syncReady = true;
    if(m.from === CLIENT_ID){ paintIfChanged(); return; }   // 自分が書いたものは無視
    const stamp = (m.at || 0) + ":" + (m.from || "");
    if(stamp === lastStamp){ paintIfChanged(); return; }    // 取り込み済み（データは同じでも接続状態は表示を更新する）
    lastStamp = stamp;
    remoteRev = m.rev || remoteRev;
    applyRemote(m.data);                                    // ここは常に再描画される
  } catch(e){
    syncNote(false, netMsg(e));
    paintIfChanged();
  }
}

/* 無料枠に収まるよう、役割と画面に応じて問い合わせ間隔を変える */
function pollMs(){
  const r = roleOf();
  if(r === "kitchen") return 3000;                                   // 注文をすぐ受け取りたい
  if(r === "order")   return state.term.stage === "active" ? 4000 : 15000;
  return 6000;
}
function restartPolling(){
  clearInterval(remoteTimer); remoteTimer = null;
  if(!endpoint()) return;
  remoteTimer = setInterval(pullRemote, pollMs());
}

/* 接続テスト：設定画面のボタンから呼ぶ */
async function testSync(){
  const url = state.syncUrl ? (isFirebase(state.syncUrl) ? fbUrl() : state.syncUrl) : endpoint();
  if(!url){ syncNote(false, "店舗コードが未設定です"); render(); return; }
  syncNote(null, "確認中…"); render();
  const method = (!state.syncUrl && state.storeCode) ? codeWriteMethod()
               : (isFirebase(state.syncUrl) ? "PUT" : "POST");
  try{
    const res = await fetch(url, { cache:"no-store" });
    if(res.status === 404 && !state.syncUrl){
      syncNote(false, "この店舗コードは見つかりません。1台目で作り直してください"); render(); return;
    }
    if(!res.ok){ syncNote(false, `つながりましたが、サーバーが ${res.status} を返しました`); render(); return; }
    await res.json().catch(()=>null);
    // 書き込みも試す（読めても書けないケースがあるため）
    const w = await fetch(url, {
      method, headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ from:CLIENT_ID, rev:remoteRev+1, at:Date.now(), data:snapshot() })
    });
    if(w.ok){
      remoteRev++;
      syncNote(true, state.syncUrl ? "接続できました。他の端末にも同じURLを入れてください"
                                   : "接続できました。他の端末にこの店舗コードを入れてください");
    }
    else syncNote(false, `読み取りはできましたが、書き込みが ${w.status} で失敗しました`);
  } catch(e){
    syncNote(false, netMsg(e));
  }
  render();
}

/* 店舗コードを新しく作る（1台目でだけ実行する）
   使えるサービスを上から順に試し、最初に成功したものを採用する。
   全部だめなら、どれがなぜ失敗したかを画面に出す。 */
async function createStoreCode(){
  syncState.detail = [];
  syncNote(null, "店舗コードを作成中…"); render();

  const payload = { from:CLIENT_ID, rev:1, at:Date.now(), data:snapshot() };
  const errs = [];

  for(const key of PROVIDER_ORDER){
    const pv = PROVIDERS[key];
    syncNote(null, `${pv.name} を試しています…`); render();
    try{
      const id = await pv.create(payload);
      setStoreCode(key + "-" + id);
      remoteRev = 1;
      syncState.detail = [];
      syncNote(true, `店舗コードを作りました（${pv.name}）。他の端末にこのコードを入力してください`);
      render(); return;
    } catch(e){
      errs.push(`${pv.name}：${netMsg(e)}`);
    }
  }

  syncState.detail = errs;
  syncNote(false, "どのサービスにも接続できませんでした");
  render();
  toast("接続できません：" + (errs[0] || ""));
}

function setStoreCode(code){
  state.storeCode = (code||"").trim().replace(/[^0-9a-zA-Z_-]/g, "");
  try{
    if(state.storeCode) localStorage.setItem(CODE_KEY, state.storeCode);
    else localStorage.removeItem(CODE_KEY);
  } catch(e){}
  remoteRev = 0; lastStamp = ""; syncReady = false;
  syncNote(null, state.storeCode ? "接続しています…" : "未設定");
  restartPolling();
  if(state.storeCode) pullRemote();
}

function setSyncUrl(url){
  state.syncUrl = (url||"").trim();
  try {
    if(state.syncUrl) localStorage.setItem(SYNC_URL_KEY, state.syncUrl);
    else localStorage.removeItem(SYNC_URL_KEY);
  } catch(e){}
  lastStamp = ""; syncReady = false; remoteRev = 0;
  syncNote(null, state.syncUrl ? "接続しています…" : "未設定");
  stopStream();
  if(state.syncUrl && isFirebase(state.syncUrl)){
    startStream();            // 変更が向こうから届くリアルタイム接続
    restartPolling();         // 取りこぼし対策の保険
  } else {
    restartPolling();
  }
  if(endpoint()) pullRemote();
}
if(endpoint()){                                   // 起動時、前回の設定があれば自動で再接続
  if(state.syncUrl && isFirebase(state.syncUrl)) startStream(); else restartPolling();
  pullRemote();
}

/* 状態を変えたら必ずこれを呼ぶ：画面更新＋他タブ／他端末へ配信＋保存 */
/* ==========================================================
   ドラッグでの並べ替え（商品・キャスト）
   ・ハンドル（⠿）を掴んだ瞬間から、指の位置にある行と即座に入れ替える。
   ・並べ替え中は再描画を止め、離した瞬間に確定して1回だけ commit() する。
   ========================================================== */
let dctx = null;

function wireDrag(){
  if(typeof document === "undefined") return;
  document.querySelectorAll(".dragh").forEach(h=>{
    if(h.dataset.wired) return;
    h.dataset.wired = "1";
    h.addEventListener("pointerdown", dragStart);
  });
}

function dragStart(e){
  const handle = e.currentTarget;
  const row = handle.closest("[data-did]");
  const list = handle.closest("[data-draglist]");
  if(!row || !list) return;
  e.preventDefault();
  try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  row.classList.add("dragging");
  handle.classList.add("pulse");
  setTimeout(()=>handle.classList.remove("pulse"), 500);
  dctx = { row, list, pid:e.pointerId };
  document.addEventListener("pointermove", dragMove);
  document.addEventListener("pointerup", dragEnd);
  document.addEventListener("pointercancel", dragEnd);
}
function dragMove(e){
  if(!dctx) return;
  e.preventDefault();
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const overRow = el && el.closest("[data-did]");
  if(!overRow || overRow === dctx.row) return;
  if(overRow.closest("[data-draglist]") !== dctx.list) return;   // ジャンルをまたいだ並べ替えはしない

  /* FLIP：並び替え前の位置を全行ぶん記録しておき、insertBefore で瞬間移動させたあと
     差分だけ逆向きに一瞬ずらして、0へアニメーションで戻す＝滑らかに動いて見える */
  const rows = [...dctx.list.children].filter(el=>el.matches && el.matches("[data-did]"));
  const before = rows.map(el=>({ el, top: el.getBoundingClientRect().top }));

  const rect = overRow.getBoundingClientRect();
  const putBefore = (e.clientY - rect.top) < rect.height / 2;
  dctx.list.insertBefore(dctx.row, putBefore ? overRow : overRow.nextSibling);

  before.forEach(b=>{
    if(b.el === dctx.row) return;                     // つかんでいる行自身は別演出（CSSのscale）に任せる
    const after = b.el.getBoundingClientRect().top;
    const delta = b.top - after;
    if(Math.abs(delta) < 1) return;
    b.el.style.transition = "none";
    b.el.style.transform = `translateY(${delta}px)`;
    requestAnimationFrame(()=>{
      b.el.style.transition = "transform .16s ease";
      b.el.style.transform = "";
    });
  });
}
function dragEnd(){
  if(!dctx) return;
  const { row, list } = dctx;
  row.classList.remove("dragging");
  document.removeEventListener("pointermove", dragMove);
  document.removeEventListener("pointerup", dragEnd);
  document.removeEventListener("pointercancel", dragEnd);
  dctx = null;

  const kind = list.dataset.draglist;
  const ids = [...list.children].filter(el=>el.matches && el.matches("[data-did]")).map(el=>el.dataset.did);
  if(kind === "cast") reorderCasts(ids);
  else if(kind && kind.indexOf("prod:") === 0) reorderProducts(kind.slice(5), ids);
}

function reorderCasts(ids){
  const byId = {}; state.casts.forEach(c=>byId[c.id]=c);
  const next = ids.map(id=>byId[id]).filter(Boolean);
  if(next.length !== state.casts.length) return;   // 想定外の状態なら何もしない
  state.casts = next;
  commit();
}
function reorderProducts(cat, ids){
  const byId = {}; state.products.filter(p=>p.cat===cat).forEach(p=>byId[p.id]=p);
  const queue = ids.map(id=>byId[id]).filter(Boolean);
  if(queue.length !== Object.keys(byId).length) return;
  const q = queue.slice();
  state.products = state.products.map(p => p.cat === cat ? q.shift() : p);
  commit();
}

function commit(){
  render();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>{ send(); saveLocal(); pushCloud(); pushRemote(); }, 60);
}
const syncOn = () => !!chan || CLOUD;

/* ヘッダーの実際の高さを測って、貼り付く要素の位置を合わせる。
   端末や文字サイズでヘッダーの高さが変わるため、固定値だと下に隠れてしまう。 */
function fitTopbar(){
  const tb = document.querySelector(".topbar");
  const h = tb ? tb.offsetHeight : 0;
  if(h > 0) document.documentElement.style.setProperty("--tb", h + "px");
}
if(typeof window !== "undefined"){
  window.addEventListener("resize", fitTopbar);
  window.addEventListener("orientationchange", ()=>setTimeout(fitTopbar, 200));
}

/* ---- 注文端末：無操作が続いたら待機画面に戻す ---- */
let idleTimer = null;
function resetIdle(){
  clearTimeout(idleTimer);
  if(!state.session || roleOf() !== "order" || state.term.stage !== "active") return;
  idleTimer = setTimeout(()=>{
    if(state.session && roleOf() === "order" && state.term.stage === "active"){
      state.term = { stage:"idle", tab:"menu", cat:"*" };
      render();
    }
  }, Math.max(10, state.idleSec) * 1000);
}
["pointerdown","touchstart","keydown","wheel","scroll"].forEach(ev=>
  document.addEventListener(ev, resetIdle, {passive:true, capture:true}));

/* ========== ticker ========== */
function tick(){
  const now = new Date();
  $("#clock").textContent = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;

  /* 売上タブ・伝票タブを開きっぱなしでも、営業日が変わった瞬間に「今日」を追従させる */
  if(state.session && state.tab === "sales" && (state.salesAuto === undefined || state.salesAuto)){
    const t = todayStr();
    if(!state.salesRange || state.salesRange.to !== t){ render(); return; }
  }
  if(state.session && state.tab === "bill" && (state.billAuto === undefined || state.billAuto)){
    const t = todayStr();
    if(!state.billRange || state.billRange.to !== t){ render(); return; }
  }

  /* 新しいオーダーが入ったら厨房画面を更新する */
  if(state.session && state.rev !== lastRev &&
     (state.tab === "kitchen" || roleOf() === "manager" || roleOf() === "staff")){
    render(); return;
  }

  /* セット料金が1時間刻みで変わったら画面を更新する */
  let feeChanged = false;
  state.tables.forEach(t=>{
    if(t.status !== "serving" || !t.seatedAt) return;
    const h = stayHours(t);
    if(t._h !== h){ if(t._h !== undefined) feeChanged = true; t._h = h; }
  });
  if(feeChanged){ render(); return; }

  document.querySelectorAll("[data-tick]").forEach(el=>{
    const [kind, val] = el.dataset.tick.split(":");
    if(kind==="up"){ el.textContent = fmt(Date.now() - Number(val)); }
    else if(kind==="rot"){
      const r = state.rotations.find(x=>x.id===val);
      if(!r) return;
      const rem = remain(r);
      el.textContent = fmt(rem);
      el.classList.toggle("over", rem < 0);
    }
  });

  document.querySelectorAll("[data-prog]").forEach(el=>{
    const r = state.rotations.find(x=>x.id===el.dataset.prog);
    if(!r) return;
    el.style.width = Math.min(100, (elapsed(r)/limitMs(r))*100) + "%";
  });

  // 交代1分前と時間超過のタイミングで一度だけ知らせる
  let redraw = false;
  state.rotations.forEach(r=>{
    if(r.closed || r.done || !r.runningSince) return;
    const rem = remain(r);

    const soon = rem <= SOON_MS;
    if(soon && !r._warn){
      r._warn = true; redraw = true;
      const t = tableOf(r.tableId);
      const nx = rounds(r)[r.index + 1];
      toast(nx ? `まもなく交代：${t?t.name:""}卓 次は ${nx.map(castName).join("・")}`
               : `まもなく初回終了：${t?t.name:""}卓`);
    }
    if(!soon && r._warn){ r._warn = false; redraw = true; }

    const over = rem < 0;
    if(over && !r._flag){ r._flag = true; redraw = true; }
    if(!over && r._flag){ r._flag = false; redraw = true; }
  });
  if(redraw && can("manage")) render();
}
setInterval(tick, 1000);

loadLocal();
render();
try { if(chan) chan.postMessage({ from:CLIENT_ID, hello:true }); } catch(e) {}
</script>
