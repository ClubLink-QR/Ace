<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>店舗管理</title>
<style>
:root{
  color-scheme:dark;          /* セレクトや数値入力などOS標準部品を暗色で描く（白背景×白文字の防止） */
  --bg:#101319;
  --surface:#181C24;
  --surface2:#202632;
  --line:#2B3240;
  --text:#E8EBF1;
  --muted:#868FA0;
  --gold:#D7B26D;
  --st-empty:#5D6B82;
  --st-serving:#3EA87B;
  --st-billing:#E3A73C;
  --st-closed:#8C6B78;
  --danger:#D65F4E;
  --r:12px;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;                 /* 連打してもダブルタップ拡大が起きないように */
  -webkit-touch-callout:none}
button,.mrow,.card,.tchip,.pcard,.tcard,.mfil,.grph,.secth{
  -webkit-user-select:none;user-select:none} /* 連打時に文字が選択されるのを防ぐ */
html,body{margin:0;padding:0}
body{
  overflow-x:hidden;                         /* 端が切れて見えなくなるのを防ぐ */
  background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:15px;line-height:1.5;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
@media(min-width:600px){body{padding-bottom:24px}}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text)}
select{-webkit-appearance:none;appearance:none;background-image:none}
select,option,optgroup{background-color:#1D2230;color:#E8EBF1}
input,textarea{background-color:var(--surface2)}
input::placeholder{color:#6E778A}
button{white-space:nowrap}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- header ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(16,19,25,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1280px;margin:0 auto;padding:8px 14px;min-height:52px;
  display:flex;align-items:center;gap:10px;
}
@media(min-width:600px){.topbar-in{min-height:52px}}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 auto;overflow:hidden}
.brand b{font-size:15px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.14em}
.clock{margin-left:auto;flex:0 0 auto;font-family:var(--mono);font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums}
.acct{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border-radius:999px;
  background:var(--surface2);border:1px solid var(--line);flex:0 0 auto}
.acct .av{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#14171E;
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}
.acct .an{font-size:12.5px;font-weight:600;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.acct .an small{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.1em;font-weight:600}
.syncdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-left:2px}
.syncdot.on{background:var(--st-serving)}
.syncdot.off{background:var(--st-empty)}
@media(max-width:679px){
  .clock{display:none}                       /* 時計を隠してアカウント表示を確保 */
  .acct .an{max-width:64px}
}
.acct{min-height:44px;flex:0 0 auto}         /* 押しやすさを確保しつつ、絶対に縮ませない */

/* ---------- tabs ---------- */
/* スマホ縦：タブは画面下に固定（親指で届く位置） */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(16,19,25,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.tabs::-webkit-scrollbar{height:0}
.tabs button{
  flex:1 0 auto;min-width:52px;padding:10px 6px;border-radius:10px;font-size:12px;font-weight:600;
  color:var(--muted);background:transparent;transition:background .15s,color .15s;
}
.tabs button[aria-selected="true"]{background:var(--surface2);color:var(--gold)}
/* タブレット・PC：タブはヘッダーの2段目に置く。
   1段目（店名・アカウント）とは別行なので、タブが増えても
   ログアウトボタンが押し出されることがない。 */
@media(min-width:600px){
  .tabs{position:static;border-top:0;backdrop-filter:none;background:none;
    max-width:1280px;margin:0 auto;padding:0 14px 8px;gap:4px}
  .tabs button{flex:0 0 auto;min-width:0;padding:8px 16px;font-size:13px;
    background:var(--surface2)}
  .tabs button[aria-selected="true"]{background:var(--surface2);color:var(--gold);
    box-shadow:inset 0 0 0 1px rgba(215,178,109,.45)}
}
@media(min-width:1100px){
  .tabs button{padding:9px 22px;font-size:13.5px}
}
/* スマホ横向き：縦の余白が少ないのでヘッダーを詰める */
@media(orientation:landscape) and (max-height:520px){
  .topbar-in{min-height:38px;padding:4px 12px}
  .tabs{padding:0 12px 5px}
  .tabs button{padding:6px 13px;font-size:12px}
  .brand b{font-size:13px}
  .acct{min-height:34px}
  .acct .av{width:22px;height:22px;font-size:10.5px}
}

/* ---------- layout ----------
   スマホ縦 → スマホ横 → タブレット → PC の順に情報量を増やす。
   基準はタブレット（横）。 */
main{max-width:1280px;margin:0 auto;padding:14px}

/* タブレット横：卓を広めに、伝票は2カラム */
@media(min-width:900px){
  main{padding:16px 20px}
}
/* PC：さらに広く使い、一覧の列数を増やす */
@media(min-width:1280px){
  main{padding:20px 28px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
  .card{min-height:130px}
  .card .name{font-size:23px}
}
.sec-head{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.sec-head:first-child{margin-top:4px}
.sec-head h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
.sec-head .rule{flex:1;height:1px;background:var(--line)}

/* ---------- summary ---------- */
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{
  display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted);
}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--text)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.chip .n{font-family:var(--mono);font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.chip .sub{font-style:normal;color:var(--gold);font-weight:600}
.d-empty{color:var(--st-empty)} .d-serving{color:var(--st-serving)}
.d-billing{color:var(--st-billing)} .d-closed{color:var(--st-closed)}

/* ---------- table grid ---------- */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
@media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}}
.card{
  position:relative;overflow:hidden;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 12px 11px;display:flex;flex-direction:column;gap:6px;min-height:118px;
  transition:transform .12s ease,border-color .15s;
}
.card:active{transform:scale(.985)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.card.s-empty{--c:var(--st-empty)}
.card.s-serving{--c:var(--st-serving);background:linear-gradient(180deg,rgba(62,168,123,.10),transparent 60%),var(--surface)}
.card.s-billing{--c:var(--st-billing);background:linear-gradient(180deg,rgba(227,167,60,.13),transparent 60%),var(--surface);border-color:rgba(227,167,60,.3)}
.card.s-closed{--c:var(--st-closed);background:linear-gradient(180deg,rgba(140,107,120,.16),transparent 60%),var(--surface)}
.card.s-closed::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(255,255,255,.05) 7px 14px);
}
.card .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.card .name{font-size:21px;font-weight:700;letter-spacing:.01em;line-height:1.15}
.card .stat{font-size:11px;font-weight:700;color:var(--c);white-space:nowrap;padding-top:3px}
.card .meta{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.card .meta .t{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card .meta .amt{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--gold);
  font-variant-numeric:tabular-nums}
.card .tcasts{font-size:11.5px;color:var(--gold);line-height:1.4;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.card .fbadge{
  display:inline-flex;align-items:center;gap:5px;align-self:flex-start;
  padding:3px 8px;border-radius:6px;background:rgba(215,178,109,.14);
  border:1px solid rgba(215,178,109,.32);color:var(--gold);font-size:11px;font-weight:700;
}
.card .fbadge .t{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- rotation card (signature) ---------- */
.rot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.rot.over{border-color:rgba(214,95,78,.45)}
.rot-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
.rot-top .tbl{font-size:16px;font-weight:700;color:var(--text)}
.rot-top .sep{color:var(--line)}
.rot-now{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.rot-cast{min-width:0}
.rot-cast .lb{font-size:10.5px;letter-spacing:.16em;color:var(--muted);margin-bottom:2px}
.rot-cast .nm{font-size:clamp(26px,7vw,40px);font-weight:700;line-height:1.05;color:var(--gold);letter-spacing:.01em;word-break:break-word}
.rot-time{margin-left:auto;text-align:right}
.rot-time .lb{font-size:10.5px;letter-spacing:.16em;color:var(--muted);margin-bottom:2px}
.rot-time .tm{font-family:var(--mono);font-size:clamp(26px,7vw,40px);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.05}
.rot-time .tm.over{color:var(--danger)}
.track{display:flex;gap:3px;margin-bottom:10px}
.seg{flex:1;height:8px;border-radius:3px;background:var(--surface2);overflow:hidden;position:relative}
.seg.done{background:rgba(215,178,109,.4)}
.seg .fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold);width:0}
.seg.over .fill{background:var(--danger)}
.rot-next{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.rot-next b{color:var(--text);font-weight:600}
.rot-acts{display:flex;gap:8px;flex-wrap:wrap}
.rot-list{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:5px}
.rot-line{display:flex;align-items:center;gap:9px;font-size:13px;padding:3px 0;color:var(--muted)}
.rot-line .no{width:22px;height:22px;flex:0 0 auto;border-radius:6px;background:var(--surface2);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700}
.rot-line.cur{color:var(--text)}
.rot-line.cur .no{background:var(--gold);color:#14171E}
.rot-line.past{opacity:.45;text-decoration:line-through}
.rot-line .names{flex:1;min-width:0}
.rot-line .clock{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:0}

/* ---------- buttons ---------- */
.btn{
  padding:11px 16px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);
  font-size:13.5px;font-weight:600;transition:filter .15s;
}
.btn:active{filter:brightness(1.25)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#14171E}
.btn.warn{background:var(--st-billing);border-color:var(--st-billing);color:#1A1408}
.btn.big{padding:16px;font-size:15.5px;font-weight:700}
.btn.dan{color:var(--danger);border-color:rgba(214,95,78,.35)}
.btn.gh{background:transparent}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:12.5px}
.btn:disabled{opacity:.4}
.add{
  width:100%;padding:15px;border-radius:var(--r);border:1px dashed var(--line);
  color:var(--muted);font-size:14px;font-weight:600;background:transparent;
}
.add:active{border-color:var(--gold);color:var(--gold)}

/* ---------- empty ---------- */
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13.5px;
  border:1px dashed var(--line);border-radius:var(--r);margin-bottom:12px}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(6,8,12,.62)}
@media(min-width:760px){.sheet{align-items:center;padding:20px}}
.panel{
  width:100%;max-width:640px;max-height:90vh;overflow:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:16px 16px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));
}
@media(min-width:760px){.panel{border-radius:16px;padding-bottom:20px}}
.panel h3{margin:0 0 14px;font-size:18px;font-weight:700}
.panel h3 small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.1em;margin-top:3px}
.field{margin-bottom:16px}
.field>label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:7px}
.inp{width:100%;padding:11px 12px;border-radius:10px;background:var(--surface2);
  border:1px solid var(--line);font-size:15px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;flex:0 0 auto;border-radius:10px;background:var(--surface2);
  border:1px solid var(--line);font-size:20px;font-weight:600;display:grid;place-items:center}
.stepper .val{flex:1;text-align:center;font-family:var(--mono);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stepper .val small{font-family:var(--font);font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.quick button{padding:6px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px}
.quick button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.statenow{display:flex;align-items:center;gap:9px;padding:12px 13px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--line);font-size:14.5px;font-weight:700;margin-bottom:16px}
.statenow .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:0 0 auto}
.statenow .t{margin-left:auto;font-family:var(--mono);font-weight:600;color:var(--muted);font-size:13px;
  font-variant-numeric:tabular-nums}
.statenow.s-empty{--c:var(--st-empty)}
.statenow.s-serving{--c:var(--st-serving)}
.statenow.s-billing{--c:var(--st-billing)}
.statenow.s-closed{--c:var(--st-closed)}
.flow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 13px;line-height:1.9}
.flow b{font-weight:700}
.flow i{font-style:normal;font-size:11px;opacity:.75}
.castpick{display:flex;flex-wrap:wrap;gap:7px}
.castpick button{padding:9px 13px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);font-size:13.5px}
.castpick button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.castpick .idx{font-family:var(--mono);font-size:11px;margin-left:6px;opacity:.8}
.ordlist{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.ordrow{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);
  border-radius:9px;padding:7px 9px}
.ordrow .no{width:22px;height:22px;border-radius:6px;background:var(--gold);color:#14171E;
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;flex:0 0 auto}
.ordrow .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ordrow button{width:32px;height:32px;border-radius:7px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;color:var(--muted);flex:0 0 auto}
.round-hint{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.6}
.round-hint b{color:var(--gold)}
.sheet-acts{display:flex;gap:8px;margin-top:20px}
.sheet-acts .btn{flex:1}

/* ---------- settings ---------- */
.setrow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;margin-bottom:7px}
.setrow .no{width:26px;flex:0 0 auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:center}
.setrow .inp{background:transparent;border:0;padding:6px 2px;font-size:14.5px;color:var(--text)}
.setrow .inp:focus{outline:none;border-bottom:1px solid var(--gold)}
.setrow .tog{padding:6px 11px;border-radius:7px;border:1px solid var(--line);font-size:11.5px;
  font-weight:700;color:var(--muted);flex:0 0 auto;white-space:nowrap}
.setrow .tog[aria-pressed="true"]{color:var(--st-serving);border-color:rgba(62,168,123,.4)}
.setrow .del{width:32px;height:32px;border-radius:7px;color:var(--muted);flex:0 0 auto;font-size:15px}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin:8px 0 0}

/* ---------- login ---------- */
:root{--tb:96px}   /* 起動直後の暫定値。実際の高さは fitTopbar() が測って上書きする */
body.login{padding:0}
body.login .topbar{display:none}
body.login main{max-width:none;padding:0}
.login-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:320px;text-align:center}
.lg-shop{font-size:21px;font-weight:700;letter-spacing:.04em}
.lg-sub{font-size:10.5px;letter-spacing:.24em;color:var(--muted);margin-top:5px}
.pindots{display:flex;justify-content:center;gap:15px;margin:32px 0 10px}
.pindots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line)}
.pindots i.on{background:var(--gold);border-color:var(--gold)}
.pinerr{height:18px;font-size:12.5px;color:var(--danger);margin-bottom:12px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:58px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  font-family:var(--mono);font-size:22px;font-weight:600}
.keypad button:active{background:var(--surface2)}
.keypad button.fn{font-family:var(--font);font-size:13.5px;color:var(--muted);background:transparent;border-color:transparent}
.login-hint{margin-top:24px;font-size:11.5px;color:var(--muted);line-height:1.9;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.login-hint b{color:var(--text);font-weight:600}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}}
.shake{animation:shake .35s}

/* ---------- order screen ---------- */
.tstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tstrip::-webkit-scrollbar{height:0}
@media(min-width:760px){.tstrip{flex-wrap:wrap;overflow:visible}}
.tchip{position:relative;overflow:hidden;flex:0 0 auto;scroll-snap-align:start;min-width:92px;text-align:left;
  padding:9px 12px 9px 15px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.tchip::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.tchip.s-empty{--c:var(--st-empty)}
.tchip.s-serving{--c:var(--st-serving)}
.tchip.s-billing{--c:var(--st-billing)}
.tchip.s-closed{--c:var(--st-closed)}
.tchip[aria-pressed="true"]{border-color:var(--gold);background:var(--surface2)}
.tchip .tn{font-size:15px;font-weight:700;line-height:1.2}
.tchip .tm{font-size:10.5px;color:var(--muted);margin-top:3px}
.tchip .tm.amt{color:var(--gold);font-weight:700;font-family:var(--mono)}

.orderbar{position:sticky;top:var(--tb);z-index:20;display:flex;align-items:center;gap:10px;
  margin:0 -14px 14px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.obt{min-width:0;font-size:19px;font-weight:700;line-height:1.2}
.obt span{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.obtotal{margin-left:auto;font-family:var(--mono);font-size:20px;font-weight:700;color:var(--gold);
  font-variant-numeric:tabular-nums}
.owrap{display:grid;gap:16px}
@media(min-width:900px){.owrap{grid-template-columns:1fr 330px;align-items:start}
  .slip{position:sticky;top:calc(var(--tb) + 74px)}}
.pgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
@media(min-width:760px){.pgrid{grid-template-columns:repeat(auto-fill,minmax(152px,1fr))}}
.pcard{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:12px 11px;min-height:76px;display:flex;flex-direction:column;
  justify-content:space-between;gap:6px;transition:transform .1s,border-color .15s}
.pcard:active{transform:scale(.97);border-color:var(--gold)}
.pcard:disabled{opacity:.4}
.pcard .pn{font-size:13.5px;font-weight:600;line-height:1.35}
.pcard .pp{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pcard .q{position:absolute;top:-7px;right:-7px;min-width:23px;height:23px;padding:0 6px;border-radius:12px;
  background:var(--gold);color:#14171E;font-family:var(--mono);font-size:12px;font-weight:700;
  display:grid;place-items:center}
.slip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.srow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.sn{flex:1;min-width:0;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.sn span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.sqc{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.sqc button{width:29px;height:29px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);
  font-size:15px;display:grid;place-items:center}
.sqc .q{width:22px;text-align:center;font-family:var(--mono);font-size:13.5px;font-weight:700}
.sq{font-family:var(--mono);font-size:13.5px;color:var(--muted)}
.ss{width:76px;text-align:right;font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.stotal{display:flex;align-items:baseline;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.stotal span{font-size:11.5px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.stotal b{margin-left:auto;font-family:var(--mono);font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.sact{margin-top:12px}
.sact .btn{width:100%}

/* ---------- product master ---------- */
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:7px}
.prow .no{width:22px;flex:0 0 auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:center}
.prow .nm{flex:1 1 150px;min-width:110px;background:transparent;border:0;padding:6px 2px;font-size:14.5px;color:var(--text)}
.prow .nm:focus{outline:none;border-bottom:1px solid var(--gold)}
.prow-b{display:flex;align-items:center;gap:6px;margin-left:auto}
.prow .yen{color:var(--muted);font-size:13px}
.prow .pr{width:88px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;
  padding:6px 8px;text-align:right;font-family:var(--mono);font-size:14px}
.prow .rl{width:106px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;
  padding:6px 8px;font-size:13px}
.prow .pin{width:66px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;
  padding:6px 8px;text-align:center;font-family:var(--mono);font-size:14px;letter-spacing:.14em}
.prow-b button{width:32px;height:32px;border-radius:7px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;color:var(--muted);flex:0 0 auto}

/* 商品一覧だけは詰め込みすぎず、2段のカード形式でゆったり表示する
   （在庫管理ボタンなどが窮屈にならないように） */
.prow.pcard{display:block;padding:13px 14px;border-radius:12px;margin-bottom:11px}
.pcard .prow-top{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.pcard .nm{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid transparent;
  padding:7px 2px;font-size:16px;font-weight:600;color:var(--text)}
.pcard .nm:focus{outline:none;border-bottom-color:var(--gold)}
.pcard .del{width:36px;height:36px;flex:0 0 auto;border-radius:9px;background:var(--surface2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--muted)}
.pcard .prow-bot{display:flex;flex-wrap:wrap;gap:14px 18px}
.pfield{display:flex;flex-direction:column;gap:6px;min-width:118px;flex:1 1 118px}
.pfield label{font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.pfield-in{display:flex;align-items:center;gap:6px}
.pcard .pr{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;
  padding:9px 10px;text-align:left;font-family:var(--mono);font-size:14.5px}
.pcard .ab{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;
  padding:9px 10px;font-size:14px}
.pcard .rl{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;
  padding:9px 10px;font-size:13.5px}
.tog.wide{width:100%;padding:11px 12px;text-align:center;font-size:13.5px}
.prow-b button:disabled{opacity:.3}

/* ---------- order terminal ---------- */
.term-idle{width:100%;min-height:62vh;display:grid;place-items:center;text-align:center;padding:30px 20px}
.ti-lb{font-size:10.5px;letter-spacing:.32em;color:var(--muted)}
.ti-no{font-size:clamp(54px,15vw,108px);font-weight:700;line-height:1;letter-spacing:.02em;margin:6px 0 4px}
.ti-cta{margin-top:28px;font-size:clamp(16px,3.6vw,21px);font-weight:700;color:var(--gold);
  border:1px solid rgba(215,178,109,.42);border-radius:999px;padding:16px 30px;
  background:rgba(215,178,109,.08);display:inline-block}
@keyframes softpulse{0%,100%{opacity:1}50%{opacity:.55}}
.ti-cta.live{animation:softpulse 2.6s ease-in-out infinite}
.ti-note{margin-top:16px;font-size:13px;color:var(--muted)}
.ti-note b{color:var(--gold);font-family:var(--mono)}
.thanks{font-size:clamp(19px,4.4vw,31px);font-weight:700;line-height:1.7;letter-spacing:.04em;
  margin:20px 0 6px}
.ghosthit{display:block;width:100%;max-width:300px;height:96px;margin:22px auto 0;
  background:transparent;border:0;padding:0;opacity:0}

.term-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;
  border-bottom:1px solid var(--line)}
.th-no{font-size:22px;font-weight:700;line-height:1.2}
.th-st{font-size:11.5px;color:var(--muted);margin-top:2px}
.th-tot{margin-left:auto;font-family:var(--mono);font-size:18px;font-weight:700;color:var(--gold);
  font-variant-numeric:tabular-nums}

.tcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:11px;display:flex;flex-direction:column;gap:8px}
.tcard.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(215,178,109,.09),transparent 70%),var(--surface)}
.tcard .ptap{width:100%;text-align:left;display:flex;flex-direction:column;justify-content:space-between;
  gap:6px;min-height:50px}
.tcard .pn{font-size:13.5px;font-weight:600;line-height:1.35}
.tcard .pp{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pqty{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.pqty button{width:32px;height:32px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);
  font-size:16px;display:grid;place-items:center;flex:0 0 auto}
.pqty .n{flex:1;text-align:center;font-family:var(--mono);font-size:15px;font-weight:700}

.gtotal{display:flex;align-items:baseline;gap:10px;background:var(--surface2);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 14px;margin-bottom:12px}
.gtotal span{font-size:11.5px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.gtotal b{margin-left:auto;font-family:var(--mono);font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}

.hbatch{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.hbatch .hh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;font-size:11px;
  letter-spacing:.1em;color:var(--muted);font-weight:700}
.hbatch .hh .amt{margin-left:auto;font-family:var(--mono);color:var(--gold);font-size:13px;letter-spacing:0}
.hline{display:flex;gap:8px;font-size:13.5px;padding:3px 0}
.hline .n{flex:1;min-width:0;overflow-wrap:anywhere}
.hline .q{font-family:var(--mono);color:var(--muted)}
.hline .a{width:74px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

.gearrow{display:flex;justify-content:flex-end;margin-bottom:-6px}
.gear{width:38px;height:38px;border-radius:9px;color:var(--muted);font-size:17px;
  display:grid;place-items:center;border:1px solid transparent}
.gear:active{background:var(--surface2);color:var(--text)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.tsel{padding:17px 8px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);
  font-size:17px;font-weight:700}
.tsel.on{border-color:var(--gold);color:var(--gold)}
.pinbox{text-align:center;font-family:var(--mono);font-size:24px;letter-spacing:.5em;padding-left:.5em}

.termfoot{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(16,19,25,.97);border-top:1px solid var(--line);backdrop-filter:blur(10px);
  padding-bottom:env(safe-area-inset-bottom)}
.confirmbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.confirmbar .cb{display:flex;align-items:baseline;gap:8px;min-width:0}
.confirmbar .cb b{font-family:var(--mono);font-size:19px;color:var(--gold);font-variant-numeric:tabular-nums}
.confirmbar .cb span{font-size:12px;color:var(--muted)}
.confirmbar .btn{margin-left:auto;flex:0 0 auto}
.termnav{display:flex;gap:6px;padding:8px 12px}
.termnav button{flex:1;padding:9px 6px;border-radius:10px;background:transparent;color:var(--muted);
  font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.termnav button[aria-selected="true"]{background:var(--surface2);color:var(--gold)}
.termnav .sub{font-family:var(--mono);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}

.bhead{display:flex;align-items:baseline;gap:8px;font-size:10.5px;letter-spacing:.12em;color:var(--muted);
  font-weight:700;margin:12px 0 2px;padding-top:9px;border-top:1px solid var(--line)}
.bhead span{margin-left:auto;font-family:var(--mono);letter-spacing:0}
.bhead.first{margin-top:0;padding-top:0;border-top:0}

.prow .flab{flex:1 1 160px;min-width:120px;font-size:14px;line-height:1.35}
.prow .flab small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.feegrid{display:grid;gap:7px}
.feebtn{display:flex;align-items:center;gap:9px;padding:12px 13px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--line);font-size:14px;font-weight:600;text-align:left}
.feebtn .ck{width:20px;height:20px;flex:0 0 auto;border-radius:5px;border:1px solid var(--line);
  display:grid;place-items:center;font-size:11px;color:transparent}
.feebtn[aria-pressed="true"]{border-color:rgba(215,178,109,.5)}
.feebtn[aria-pressed="true"] .ck{background:var(--gold);border-color:var(--gold);color:#14171E}
.feebtn .sub{font-size:11px;color:var(--muted);font-weight:500}
.feebtn b{margin-left:auto;font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.feebtn[aria-pressed="true"] b{color:var(--gold)}

/* ---------- animations（軽量・CSSのみ） ---------- */
@keyframes sheetIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes barIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes badge{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
.panel{animation:sheetIn .18s ease-out}
.confirmbar{animation:barIn .18s ease-out}
.korder.in{animation:rowIn .22s ease-out}
.nbadge.live{animation:badge 1.6s ease-in-out infinite}

/* ---------- 縦型メニュー ---------- */
.mcats{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:2px 0 10px;position:sticky;top:var(--tb);z-index:12;background:var(--bg)}
.mcats::-webkit-scrollbar{height:0}
.mfil{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.mfil[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--surface2)}
.mlist{border-top:1px solid var(--line)}
.mcat{position:sticky;top:calc(var(--tb) + 44px);z-index:10;background:var(--bg);
  font-size:10.5px;letter-spacing:.16em;font-weight:700;color:var(--gold);
  padding:12px 2px 7px;border-bottom:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);
  transition:background .15s,box-shadow .15s}
.mrow.on{background:rgba(215,178,109,.07);box-shadow:inset 3px 0 0 var(--gold)}
.mrow.sold{opacity:.42}
.mtap{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:15px 10px 15px 12px;text-align:left}
.mn{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.mn em{font-style:normal;margin-left:8px;font-size:10.5px;font-weight:700;color:var(--danger);
  border:1px solid rgba(214,95,78,.4);border-radius:5px;padding:2px 6px;vertical-align:2px}
.mp{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.mrow.on .mp{color:var(--gold)}
.mq{display:flex;align-items:center;gap:5px;padding-right:8px;flex:0 0 auto}
.mq button{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);
  font-size:17px;display:grid;place-items:center}
.mq span{min-width:26px;text-align:center;font-family:var(--mono);font-size:15px;font-weight:700}

/* ---------- 開閉セクション（▼で増やす／▲で減らす） ---------- */
.bigsync{border-radius:var(--r);padding:14px 15px;border:1px solid var(--line);background:var(--surface)}
.bigsync .bs-t{font-size:15.5px;font-weight:700;color:var(--muted)}
.bigsync .bs-m{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.bigsync.on{border-color:rgba(62,168,123,.5);background:linear-gradient(180deg,rgba(62,168,123,.12),transparent 70%),var(--surface)}
.bigsync.on .bs-t{color:var(--st-serving)}
.bigsync.ng{border-color:rgba(214,95,78,.5);background:linear-gradient(180deg,rgba(214,95,78,.10),transparent 70%),var(--surface)}
.bigsync.ng .bs-t{color:var(--danger)}
.dragh{flex:0 0 auto;padding:8px 9px;margin:-4px 0;color:var(--muted);font-size:17px;
  cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;line-height:1}
.dragh:active{cursor:grabbing;color:var(--gold)}
/* つかんでいる行：持ち上がって見えるようにする。並び直り自体は insertBefore で
   即座に起きるので、まわりの行は JS 側で FLIP アニメーションを掛けて滑らかに追従させる */
.prow,.setrow{transition:transform .16s ease,box-shadow .16s ease}
.prow.dragging,.setrow.dragging{
  position:relative;z-index:30;background:var(--surface2);
  box-shadow:0 14px 30px rgba(0,0,0,.5),0 0 0 1px rgba(215,178,109,.5);
  transform:scale(1.025);
}
.dragh.pulse{animation:handlePulse .5s ease}
@keyframes handlePulse{0%{color:var(--gold);transform:scale(1.3)}100%{color:var(--muted);transform:scale(1)}}
.drag-ghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;
  background:var(--surface2);border:1px solid var(--gold);border-radius:10px;
  padding:10px 12px;font-size:14px;font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.5);
  display:flex;align-items:center;gap:8px;opacity:.96}
.drag-slot{border-radius:9px;background:rgba(215,178,109,.14);
  border:1px dashed rgba(215,178,109,.5);margin:2px 0}

.errbox{background:rgba(214,95,78,.10);border:1px solid rgba(214,95,78,.35);border-radius:10px;
  padding:11px 13px;margin-top:9px;font-size:12px;line-height:1.75;color:var(--text)}
.errbox b{display:block;color:var(--danger);font-size:11.5px;letter-spacing:.06em;margin-bottom:4px}
.errbox .hint{margin-top:7px;color:var(--muted);font-size:11.5px}
.codebox{background:var(--surface2);border:1px solid rgba(215,178,109,.45);border-radius:10px;
  padding:14px 12px;margin-bottom:9px;text-align:center;font-family:var(--mono);
  font-size:17px;font-weight:700;color:var(--gold);letter-spacing:.06em;word-break:break-all}

/* ---------- 売上 ---------- */
.daterow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.daterow .inp{width:auto;flex:1 1 130px;min-width:120px}
.dsep{color:var(--muted);font-size:13px}
.castable{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:4px 12px;margin-bottom:4px}
.ctr{display:grid;grid-template-columns:1.6fr .7fr .7fr .7fr 1.1fr;gap:6px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ctr:last-child{border-bottom:0}
.ctr.ch{font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:9px 0 8px}
.ctr span{min-width:0;overflow-wrap:anywhere}
.ctr span:not(:first-child){text-align:center;font-family:var(--mono);overflow-wrap:normal}
.ctr .amt{text-align:right;color:var(--gold);font-weight:700}
.ctr.zero{opacity:.55}
.ctr .off{margin-left:6px;font-style:normal;font-size:10px;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;vertical-align:1px}

.sect{border-bottom:1px solid var(--line)}
.secth{width:100%;display:flex;align-items:center;gap:10px;padding:15px 3px;text-align:left}
.secth .stt{font-size:14.5px;font-weight:700}
.secth .smeta{font-size:11.5px;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}
.secth .sar{margin-left:auto;color:var(--muted);font-size:11px;transition:color .15s}
.secth[aria-expanded="true"] .stt,.secth[aria-expanded="true"] .sar{color:var(--gold)}
.sectb{padding:2px 0 20px;animation:rowIn .18s ease-out}

/* ---------- 交代アラート ---------- */

/* ---------- 折りたたみジャンル ---------- */

.add.sm{padding:11px;font-size:13px}

/* ---------- 厨房：オーダー通知 ---------- */
.nbadge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 6px;border-radius:10px;
  background:var(--danger);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700}
.korder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;margin-bottom:9px}
.korder.new{border-color:rgba(227,167,60,.55);background:linear-gradient(180deg,rgba(227,167,60,.10),transparent 60%),var(--surface)}
.korder .kh{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.korder .kt{font-size:19px;font-weight:700}
.korder .km{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.korder .ka{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--gold);font-weight:700}
.korder .kl{display:flex;gap:8px;font-size:14.5px;padding:4px 0}
.korder .kl .n{flex:1}
.korder .kl .q{font-family:var(--mono);font-weight:700;color:var(--gold)}
.korder .btn{margin-top:11px;width:100%}
.korder.done{opacity:.5}

/* ---------- 在庫 ---------- */
.tog{padding:7px 11px;border-radius:7px;border:1px solid var(--line);font-size:11.5px;
  font-weight:700;color:var(--muted);flex:0 0 auto;background:var(--surface2);white-space:nowrap}
.slab{font-size:11.5px;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.strow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.strow.out{border-color:rgba(214,95,78,.4)}
.strow .sname{font-size:14.5px;font-weight:600;line-height:1.35}
.strow .sname small{color:var(--muted);font-family:var(--mono);font-weight:500;margin-left:8px;font-size:12px}
.strow .sname em{font-style:normal;margin-left:8px;font-size:10.5px;font-weight:700;color:var(--danger);
  border:1px solid rgba(214,95,78,.4);border-radius:5px;padding:2px 6px}
.strow .sctl{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:11px}
.strow .sctl button{width:38px;height:38px;flex:0 0 auto;border-radius:9px;background:var(--surface2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:17px;color:var(--text)}
.strow .sctl button:active{background:var(--surface)}
.strow .stk{width:64px;height:38px;text-align:center;font-size:15px;background:var(--surface2);
  border:1px solid var(--line);border-radius:9px}
.strow .slab{font-size:12.5px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:10px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--st-serving);flex:0 0 auto}
.sync.off .dot{background:var(--st-closed)}
.tog[aria-pressed="true"]{color:var(--st-serving);border-color:rgba(62,168,123,.45)}
.tog.warn[aria-pressed="true"]{color:var(--danger);border-color:rgba(214,95,78,.45)}
.stk{width:56px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;
  padding:6px 4px;text-align:center;font-family:var(--mono);font-size:14px}
.prow-b .sq{width:30px;height:30px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:15px;color:var(--text);flex:0 0 auto}

/* ---------- スマートフォン幅への対応（タブレットの表示は変えない） ---------- */
@media(max-width:480px){
  main{padding:12px 10px}
  .topbar-in{padding:6px 10px;gap:8px;min-height:48px}
  .acct{min-height:40px;padding:3px 8px 3px 3px}
  .acct .av{width:24px;height:24px;font-size:11px}

  .brand b{font-size:13.5px}

  .prow .nm{flex:1 1 100%;min-width:0}
  .prow-b{flex-wrap:wrap;justify-content:flex-end;gap:5px}

  .mtap{padding:13px 8px 13px 10px}

  .ctr{grid-template-columns:1.3fr .55fr .55fr .55fr 1fr;gap:4px;font-size:12px}

  .rot{padding:12px}

  .keypad button{height:52px;font-size:20px}

}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;
  font-size:13px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:toastIn .18s ease-out}
@media(min-width:600px){.toast{bottom:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><b id="shopName">店舗管理</b></div>
    <div class="clock" id="clock">--:--</div>
    <button class="acct" id="acct" data-acct="1"></button>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>

<main id="view"></main>
<div id="sheetHost"></div>

<script>
"use strict";

/* ========== state ========== */
const uid = () => Math.random().toString(36).slice(2, 9);
const S = {
  empty:   { key:"empty",   label:"空席",     cls:"d-empty",   color:"var(--st-empty)" },
  serving: { key:"serving", label:"接客中",   cls:"d-serving", color:"var(--st-serving)" },
  billing: { key:"billing", label:"会計待ち", cls:"d-billing", color:"var(--st-billing)" },
  closed:  { key:"closed",  label:"使用不可", cls:"d-closed",  color:"var(--st-closed)" }
};
const ORDER = ["empty","serving","billing","closed"];

function mkTable(n){
  return { id:uid(), name:String(n), status:"empty", guests:0, statusSince:Date.now(),
           seatedAt:null, billedAt:null, firstFee:null, casts:[], customerName:"",
           fees:{ set:true, nom:true, douhan:false } };
}
/* 権限：注文専用 / 厨房 / ホール / 管理者 */
const ROLES = {
  order:   { label:"注文専用", tabs:["order"] },
  kitchen: { label:"厨房",     tabs:["kitchen","stock"] },
  staff:   { label:"ホール",   tabs:["tables","order","first","bill","sales"] },
  manager: { label:"管理者",   tabs:["tables","first","bill","kitchen","sales","settings"] }
};
const TAB_LABEL = { tables:"テーブル", order:"注文", first:"初回", bill:"伝票",
                    kitchen:"厨房", stock:"在庫", sales:"売上", settings:"設定" };

const SEED_CATS = ["ドリンク","ボトル・シャンパン","フード","その他"];
const SEED_PRODUCTS = [
  ["キャストドリンク", 1500, "ドリンク", 99], ["ハイボール", 1000, "ドリンク", 60],
  ["ビール", 1200, "ドリンク", 48], ["焼酎（グラス）", 1000, "ドリンク", 60],
  ["ソフトドリンク", 800, "ドリンク", 60],
  ["ハウスボトル", 15000, "ボトル・シャンパン", 12], ["モエ・シャンドン", 50000, "ボトル・シャンパン", 6],
  ["ヴーヴ・クリコ", 60000, "ボトル・シャンパン", 4], ["ドン ペリニヨン 白", 120000, "ボトル・シャンパン", 2],
  ["フルーツ盛り", 5000, "フード", 15], ["乾き物", 1500, "フード", 30], ["チョコレート", 1200, "フード", 20]
];
const state = {
  shopName:"店舗管理",
  tables: Array.from({length:10}, (_,i)=>mkTable(i+1)),
  casts: ["キャストA","キャストB","キャストC","キャストD","キャストE","キャストF"]
          .map(n=>({ id:uid(), name:n, active:true })),
  categories: SEED_CATS.slice(),
  products: SEED_PRODUCTS.map(([name,price,cat,stock])=>
    ({ id:uid(), name, price, cat, stock, track: cat==="ボトル・シャンパン" })),
  accounts: [
    { id:uid(), name:"注文端末", role:"order",   pin:"1111" },
    { id:uid(), name:"ホール",   role:"staff",   pin:"2222" },
    { id:uid(), name:"厨房",     role:"kitchen", pin:"3333" },
    { id:uid(), name:"店長",     role:"manager", pin:"9999" }
  ],
  orders: {},          // tableId -> [{id, at, manual, lines:[...]}]
  cart: {},            // tableId -> [{productId, name, price, qty}]（確定前）
  fees: {              // 自動でつく料金（すべてカスタム可）
    setBase:3000,      // セット料金の基本
    setStep:1000,      // 1時間経過ごとの加算
    setCap:5000,       // ここに達したらフリータイム（打ち止め）
    nom:1000,          // 指名料
    douhan:1000,       // 同伴料
    firstHigh:1000,     // 初回料金（高いほう）
    firstLow:0,         // 初回料金（低いほう）
    service:10, serviceOn:true,   // サービス料（％）
    tax:10,     taxOn:true        // 消費税（％）
  },
  logoutPin: "1234",   // ログアウトに必要なパスワード
  idleSec: 60,         // 注文端末が待機画面に戻るまでの無操作時間
  openCats: {},        // 商品・在庫で開いているジャンル
  openSecs: {},        // 設定で開いているセクション
  rev: 0,              // 注文の更新カウンタ（厨房画面の自動更新に使う）
  billHistory: [],     // 会計完了ごとに1件ずつ記録（売上タブ・日付検索・キャスト集計に使う）
  syncUrl: "",          // 独自サーバーを使う場合のURL（上級者向け）
  storeCode: "",        // 店舗コード。これが同じ端末どうしが自動で同期する
  billTable: null,      // 伝票タブで選択中の卓
  rotations: [],
  defaultMin: 10,
  session: null,       // ログイン中のアカウントID
  pin: "", pinErr: "",
  tab:"tables",
  filter:"all",
  orderTable:null,     // 注文タブ（ホール・管理者）で選択中の卓
  deviceTable:null,    // この端末に固定された卓（歯車＋管理者PINで設定）
  term:{ stage:"idle", tab:"menu", cat:"*" }   // 注文端末の画面状態
};

/* ========== helpers ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const castName = id => (state.casts.find(c=>c.id===id)||{name:"—"}).name;
const tableOf = id => state.tables.find(t=>t.id===id);
const rotOf = tid => state.rotations.find(r=>r.tableId===tid && !r.closed);
const prodOf = id => state.products.find(p=>p.id===id);
/* ジャンルごとに [ジャンル名, 商品配列] を返す（未分類は最後） */
function prodGroups(){
  const gs = state.categories.map(c => [c, state.products.filter(p=>p.cat===c)]);
  const rest = state.products.filter(p => !state.categories.includes(p.cat));
  if(rest.length) gs.push(["未分類", rest]);
  return gs.filter(([,ps])=>ps.length);
}

/* ---- アカウント / 権限 ---- */
const acctOf = () => state.accounts.find(a=>a.id===state.session) || null;
const roleOf = () => (acctOf() || {role:"manager"}).role;
const allowedTabs = () => ROLES[roleOf()].tabs;
const can = k => {
  const r = roleOf();
  if(k === "settings") return r === "manager";                  // 設定は管理者のみ
  if(k === "manage")   return r === "staff" || r === "manager"; // 卓の状態変更・会計完了
  if(k === "order")    return r === "order" || r === "staff";  // 注文の入力（管理者は不可）
  return true;
};

/* ---- 注文（確定した「一回のオーダー」単位で積む） ---- */
const yen = n => "¥" + Number(n||0).toLocaleString("ja-JP");
const batchesOf = tid => state.orders[tid] || [];
const allLines = tid => batchesOf(tid).flatMap(b=>b.lines);
const orderTotal = tid => allLines(tid).reduce((s,l)=>s + l.price*l.qty, 0);
const orderCount = tid => allLines(tid).reduce((s,l)=>s + l.qty, 0);
const batchSum = b => b.lines.reduce((s,l)=>s + l.price*l.qty, 0);

function pushBatch(tid, lines, manual){
  if(!state.orders[tid]) state.orders[tid] = [];
  state.orders[tid].push({ id:uid(), at:Date.now(), manual:!!manual, done:false, lines });
  state.rev++;                       // 厨房画面に新着として届く
}
/* 厨房のオーダー一覧（全卓を新しい順に） */
function kitchenFeed(){
  const out = [];
  state.tables.forEach(t => batchesOf(t.id).forEach(b => out.push({ b, t })));
  return out.sort((x,y)=>y.b.at - x.b.at);
}
function findBatch(bid){
  for(const tid in state.orders){
    const b = state.orders[tid].find(x=>x.id===bid);
    if(b) return { b, t: tableOf(tid) };
  }
  return null;
}
/* スタッフの手入力ぶんは1つのまとまりに追記していく */
function addLine(tid, pid){
  const p = prodOf(pid); if(!p) return;
  if(!state.orders[tid]) state.orders[tid] = [];
  let b = state.orders[tid].find(x=>x.manual && !x.done);
  if(!b){ b = { id:uid(), at:Date.now(), manual:true, done:false, lines:[] }; state.orders[tid].push(b); }
  // 同じ商品でも売値が変わっていれば別行にする（注文時点の値段を保持）
  const hit = b.lines.find(l => l.productId===pid && l.price===p.price);
  if(hit) hit.qty++;
  else b.lines.push({ id:uid(), productId:pid, name:p.name, abbr:p.abbr||"", price:p.price, qty:1 });
  b.at = Date.now(); takeStock(pid, 1); state.rev++;
}
function setQty(tid, lid, dv){
  const bs = state.orders[tid]; if(!bs) return;
  for(const b of bs){
    const l = b.lines.find(x=>x.id===lid);
    if(l){ l.qty += dv; if(l.qty <= 0) b.lines = b.lines.filter(x=>x.id!==lid); break; }
  }
  state.orders[tid] = bs.filter(b=>b.lines.length);
}

/* ---- 料金（入店時刻から自動計算。会計を押した時点で止まる） ---- */
const stayEnd = t => t.billedAt || Date.now();
const stayHours = t => t.seatedAt ? Math.floor((stayEnd(t) - t.seatedAt) / 3600000) : 0;
function setFee(t){
  if(!t.seatedAt) return 0;
  return Math.min(state.fees.setBase + stayHours(t) * state.fees.setStep, state.fees.setCap);
}
const isFreeTime = t => t.seatedAt && setFee(t) >= state.fees.setCap;

function feeLines(t){
  if(!t.seatedAt) return [];
  const out = [];
  if(t.firstFee !== null && t.firstFee !== undefined){
    const n = Math.max(1, t.guests || 1);
    out.push({ key:"first", name:"初回料金", amount:t.firstFee * n,
               note:`${yen(t.firstFee)} × ${n}名` });
  }
  if(t.fees.set) out.push({ key:"set", name:"セット料金", amount:setFee(t),
    note: isFreeTime(t) ? "フリータイム" : (stayHours(t) ? `${stayHours(t)}時間経過` : "1時間以内") });
  if(t.fees.nom)    out.push({ key:"nom",    name:"指名料", amount:state.fees.nom });
  if(t.fees.douhan) out.push({ key:"douhan", name:"同伴料", amount:state.fees.douhan });
  return out;
}
const feeTotal  = t => feeLines(t).reduce((s,l)=>s + l.amount, 0);

/* 小計 → サービス料 → 消費税 → 合計 */
function bill(t){
  if(!t) return { sub:0, svc:0, tax:0, total:0 };
  const isFirst = t.firstFee !== null && t.firstFee !== undefined;   // 初回はサービス料・消費税の対象外
  const sub = feeTotal(t) + orderTotal(t.id);
  const svc = (!isFirst && state.fees.serviceOn) ? Math.floor(sub * state.fees.service / 100) : 0;
  const tax = (!isFirst && state.fees.taxOn)     ? Math.floor((sub + svc) * state.fees.tax / 100) : 0;
  const raw = sub + svc + tax;
  const total = Math.floor(raw / 100) * 100;      // 下二桁切り捨て
  return { sub, svc, tax, raw, cut: raw - total, total, isFirst };
}
const billTotal = t => bill(t).total;

/* 小計・サービス料・消費税・合計の表示ブロック */
function totalsBlock(t){
  const b = bill(t);
  const line = (l,v)=>`<div class="srow"><div class="sn">${l}</div><div class="ss">${yen(v)}</div></div>`;
  return `${(b.svc||b.tax) ? `<div class="bhead">お会計<span>${yen(b.sub)}</span></div>
      ${b.svc ? line(`サービス料 ${state.fees.service}%`, b.svc) : ""}
      ${b.tax ? line(`消費税 ${state.fees.tax}%`, b.tax) : ""}` : ""}
    ${b.isFirst ? `<p class="note" style="margin:6px 0 0">初回のためサービス料・消費税は対象外です。</p>` : ""}
    <div class="stotal"><span>合計</span><b>${yen(b.total)}</b></div>`;
}

/* ---- カート（確定前） ---- */
const cartOf = tid => state.cart[tid] || [];
const cartTotal = tid => cartOf(tid).reduce((s,l)=>s + l.price*l.qty, 0);
const cartCount = tid => cartOf(tid).reduce((s,l)=>s + l.qty, 0);

function cartAdd(tid, pid, dv){
  const p = prodOf(pid); if(!p) return;
  if(!state.cart[tid]) state.cart[tid] = [];
  const c = state.cart[tid];
  const hit = c.find(l=>l.productId===pid);
  if(hit){
    hit.qty += dv;
    if(hit.qty <= 0) state.cart[tid] = c.filter(l=>l.productId!==pid);
  } else if(dv > 0){
    c.push({ productId:pid, name:p.name, abbr:p.abbr||"", price:p.price, qty:dv });
  }
}
function takeStock(pid, qty){
  const p = prodOf(pid); if(!p || !p.track) return;   // 在庫管理する商品だけ減らす
  p.stock = Math.max(0, p.stock - qty);
}
function cartConfirm(tid){
  const c = cartOf(tid); if(!c.length) return false;
  const t = tableOf(tid);
  if(t.status === "empty") go(t, "serving");   // 注文が入った時点で接客中に
  pushBatch(tid, c.map(l=>({ id:uid(), productId:l.productId, name:l.name, abbr:l.abbr||"", price:l.price, qty:l.qty })), false);
  c.forEach(l=>takeStock(l.productId, l.qty));
  state.cart[tid] = [];
  return true;
}
const outOfStock = p => p.track && p.stock <= 0;                 // 在庫切れ＝欠品
const soldOut = p => outOfStock(p);                              // 注文できない状態
const stockLabel = p => outOfStock(p) ? "欠品" : "";

function fmt(ms){
  const neg = ms < 0; const s = Math.floor(Math.abs(ms)/1000);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = s%60;
  const p = n => String(n).padStart(2,"0");
  return (neg?"+":"") + (h>0 ? `${h}:${p(m)}:${p(x)}` : `${m}:${p(x)}`);
}
function hhmm(ts){ const d=new Date(ts); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
/* 売上タブ用：「0時15分」のような日本語表記（コロン表記が必要なタイマー等はhhmmのまま） */
function hhmmJ(ts){ const d=new Date(ts); return `${d.getHours()}時${String(d.getMinutes()).padStart(2,"0")}分`; }

function toast(msg){
  const old = document.querySelector(".toast"); if(old) old.remove();
  const el = document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 2200);
}

/* ---- rotation math ---- */
function rounds(r){
  const out = [];
  for(let i=0;i<r.order.length;i+=r.perRound) out.push(r.order.slice(i,i+r.perRound));
  return out;
}
function elapsed(r){
  return r.elapsedMs + (r.runningSince ? Date.now()-r.runningSince : 0);
}
function limitMs(r){ return r.minutes*60*1000; }
function remain(r){ return limitMs(r) - elapsed(r); }

function advance(r){
  const total = rounds(r).length;
  if(r.index + 1 >= total){ r.done = true; r.runningSince = null; r.elapsedMs = 0; }
  else { r.index++; r.elapsedMs = 0; r.runningSince = Date.now(); }
  render();
}

/* ========== render ========== */
function render(){
  const v = $("#view");

  /* 未ログイン：ログイン画面のみ */
  if(!state.session){
    document.body.classList.add("login");
    v.innerHTML = viewLogin();
    return;
  }
  document.body.classList.remove("login");

  $("#shopName").textContent = state.shopName || "店舗管理";

  /* 権限外のタブに居たら、その権限で最初のタブへ戻す */
  const tabs = allowedTabs();
  if(!tabs.includes(state.tab)) state.tab = tabs[0];
  const pend = kitchenFeed().filter(x=>!x.b.done).length;
  $("#tabs").innerHTML = tabs.map(t=>
    `<button role="tab" data-tab="${t}" aria-selected="${state.tab===t}">${TAB_LABEL[t]}${
      (t==="kitchen" && pend) ? ` <span class="nbadge live">${pend}</span>` : ""}</button>`).join("");
  $("#tabs").style.display = tabs.length > 1 ? "" : "none";

  const a = acctOf();
  const linked = syncState.ok === true;
  $("#acct").setAttribute("aria-label", `${a.name}（${ROLES[a.role].label}）／ログアウト`);
  $("#acct").innerHTML = `<span class="av">${esc((a.name||"?").slice(0,1))}</span>
    <span class="an">${esc(a.name)}<small>${ROLES[a.role].label}</small></span>
    <span class="syncdot ${linked?"on":"off"}" title="${linked?"他端末と連携中":"この端末のみ"}"></span>`;

  if(state.orderTable && !tableOf(state.orderTable)) state.orderTable = null;
  const isTerm = roleOf() === "order";

  const ab = alertBar();
  v.innerHTML = ab + (state.tab==="tables"  ? viewTables()
              : state.tab==="order"   ? (isTerm ? viewTerminal() : viewOrder())
              : state.tab==="first"   ? viewFirst()
              : state.tab==="kitchen" ? viewKitchen()
              : state.tab==="stock"   ? viewStock()
              : state.tab==="bill"    ? viewBills()
              : state.tab==="sales"   ? viewSales()
              : viewSettings());
  lastRev = state.rev;

  /* 固定フッターぶんの余白を実寸で確保 */
  fitTopbar();
  wireDrag();
  const foot = document.querySelector(".termfoot");
  document.body.style.paddingBottom = foot ? (foot.offsetHeight + 18) + "px" : "";
  tick();
  resetIdle();
}

/* ---- first rotation ---- */
function viewFirst(){
  const act = state.rotations.filter(r=>!r.closed);
  const body = act.length ? act.map(rotCard).join("")
    : `<div class="empty">進行中の初回はありません。<br>下のボタンから開始できます。</div>`;
  return `<div class="sec-head"><h2>進行中の初回</h2><div class="rule"></div></div>
    ${body}
    <button class="add" data-new-rot="1">＋ 新しい初回を始める</button>`;
}

function rotCard(r){
  const t = tableOf(r.tableId);
  const rs = rounds(r);
  const cur = rs[r.index] || [];
  const nxt = rs[r.index+1];
  const over = !r.done && remain(r) < 0;

  const track = rs.map((_,i)=>`<div class="seg ${i<r.index?"done":""} ${i===r.index&&over?"over":""}">
      ${i===r.index?`<div class="fill" data-prog="${r.id}"></div>`:i<r.index?`<div class="fill" style="width:100%"></div>`:""}
    </div>`).join("");

  let acc = r.startedAt;
  const lines = rs.map((g,i)=>{
    const at = hhmm(acc); acc += limitMs(r);
    const cls = i===r.index ? "cur" : (i<r.index ? "past" : "");
    return `<div class="rot-line ${cls}"><span class="no">${i+1}</span>
      <span class="names">${esc(g.map(castName).join("　／　"))}</span>
      <span class="clock">${at}〜</span></div>`;
  }).join("");

  const head = `<div class="rot-top">
      <span class="tbl">${esc(t?t.name:"—")}</span><span class="sep">|</span>
      <span>${r.guests}名</span><span class="sep">|</span>
      <span>1組 ${r.minutes}分</span><span class="sep">|</span>
      <span>同時 ${r.perRound}名</span><span class="sep">|</span>
      <span>全${rs.length}組</span>
    </div>`;

  if(r.done){
    return `<div class="rot"><div>${head}</div>
      <div class="rot-now"><div class="rot-cast"><div class="lb">ステータス</div>
        <div class="nm" style="font-size:26px">回し終了</div></div></div>
      <div class="track">${track}</div>
      <div class="rot-acts">
        <button class="btn pri" data-close-rot="${r.id}">閉じる</button>
        <button class="btn gh" data-restart-rot="${r.id}">もう一周する</button>
      </div>
      <div class="rot-list">${lines}</div></div>`;
  }

  const soon = !over && remain(r) <= SOON_MS;
  return `<div class="rot ${over?"over":""} ${soon?"soon":""}">
    ${head}
    <div class="rot-now">
      <div class="rot-cast"><div class="lb">${r.runningSince?"接客中":"一時停止中"}</div>
        <div class="nm">${esc(cur.map(castName).join(" ／ "))}</div></div>
      <div class="rot-time"><div class="lb">${over?"時間超過":"残り"}</div>
        <div class="tm ${over?"over":""}" data-tick="rot:${r.id}"></div></div>
    </div>
    <div class="track">${track}</div>
    <div class="rot-next">${soon?`<span style="color:var(--st-billing);font-weight:700">まもなく交代 ・ </span>`:""}次 ${
      r.index+2>rs.length?"— なし（最終組）":`<b>${esc((nxt||[]).map(castName).join(" ／ "))}</b>`}</div>
    <div class="rot-acts">
      <button class="btn pri" data-next-rot="${r.id}">次の組へ</button>
      <button class="btn" data-pause-rot="${r.id}">${r.runningSince?"一時停止":"再開"}</button>
      <button class="btn gh" data-extend-rot="${r.id}">＋1分</button>
      <button class="btn dan" data-close-rot="${r.id}">終了</button>
    </div>
    <div class="rot-list">${lines}</div>
  </div>`;
}

/* ---- 交代1分前のお知らせ（ホール・管理者の全画面に出す） ---- */
const SOON_MS = 60000;
function soonRotations(){
  return state.rotations.filter(r=>{
    if(r.closed || r.done || !r.runningSince) return false;
    const rem = remain(r);
    return rem <= SOON_MS;
  });
}
function alertBar(){
  if(!can("manage")) return "";
  const rs = soonRotations();
  if(!rs.length) return "";
  return rs.map(r=>{
    const t = tableOf(r.tableId);
    const nx = rounds(r)[r.index + 1];
    const over = remain(r) < 0;
    return `<div class="alert"><span class="ai"></span>
      <div><b>${esc(t ? t.name : "—")}卓</b> ${over ? "交代時間を過ぎています" : "まもなく交代"}
        ${nx ? `／ 次は <b>${esc(nx.map(castName).join("・"))}</b>` : "／ これが最終組です"}</div>
      <span class="t" data-tick="rot:${r.id}"></span></div>`;
  }).join("");
}

/* ---- 伝票 ----
   進行中の卓と、会計済みの履歴の両方を、同じ内訳フォーマットで表示する。 */

/* fees / orders / b をもらって内訳を組み立てる（進行中でも履歴でも同じものを使う） */
function receiptBody(fees, orders, b, svcRate, taxRate){
  const row = (label, amount, note) => `<div class="srow">
      <div class="sn">${esc(label)}${note?`<span>${esc(note)}</span>`:""}</div>
      <div class="ss">${yen(amount)}</div></div>`;

  const feeRows = fees.length
    ? `<div class="bhead first">料金<span>${yen(fees.reduce((s,l)=>s+l.amount,0))}</span></div>
       ${fees.map(l=>row(l.name, l.amount, l.note)).join("")}` : "";

  /* 同じ略称（無ければ商品名）はまとめて合算し、1行あたり最大10個までにして
     10個を超えたら「S×10」「S×10」「S×3」のように行を分ける。
     金額は最後の行で端数調整して合計がぴったり合うようにする。 */
  const orderSum = orders.reduce((s,l)=>s+l.price*l.qty, 0);
  const grouped = [];
  const idx = {};
  orders.forEach(l=>{
    const key = l.abbr || l.name;
    if(!(key in idx)){ idx[key] = grouped.length; grouped.push({ key, qty:0, amount:0 }); }
    const g = grouped[idx[key]];
    g.qty += l.qty; g.amount += l.price * l.qty;
  });
  const orderLines = [];
  grouped.forEach(g=>{
    if(g.qty <= 10){ orderLines.push({ label:g.key, qty:g.qty, amount:g.amount }); return; }
    let remaining = g.qty, amountLeft = g.amount;
    while(remaining > 0){
      const chunkQty = Math.min(10, remaining);
      remaining -= chunkQty;
      const chunkAmount = remaining > 0 ? Math.round(g.amount * chunkQty / g.qty) : amountLeft;
      amountLeft -= chunkAmount;
      orderLines.push({ label:g.key, qty:chunkQty, amount:chunkAmount });
    }
  });
  const orderRows = orderLines.length
    ? `<div class="bhead ${fees.length?"":"first"}">ご注文<span>${yen(orderSum)}</span></div>
       ${orderLines.map(l=>row(l.label, l.amount, `× ${l.qty}`)).join("")}` : "";

  return `<div class="slip">
      ${feeRows}${orderRows}
      ${(!fees.length && !orders.length) ? `<div class="empty" style="margin:0">まだ何も入っていません。</div>` : ""}
      <div class="bhead">小計<span>${yen(b.sub)}</span></div>
      ${b.svc ? row(`サービス料 ${svcRate}%`, b.svc) : ""}
      ${row(`消費税（TAX） ${taxRate}%`, b.tax)}
      ${b.isFirst ? `<p class="note" style="margin:6px 0 0">初回のためサービス料・消費税は対象外です。</p>` : ""}
      <div class="stotal"><span>お支払い総額</span><b>${yen(b.total)}</b></div>
    </div>`;
}

  return `<div class="sec-head" style="margin-top:0"><h2>ご利用中</h2><div class="rule"></div></div>

/* ---- 売上（日付検索・キャスト別集計） ---- */
/* ---- 営業日（深夜3時までは「前日の営業日」として扱う）----
   ホスト・ホステス業態は日をまたいで営業するため、入店時刻をもとに
   「その来店がどの日の売上か」を決める。3時0分より前の入店は前日扱い。 */
const BIZ_CUTOFF_HOUR = 3;
function bizDateOf(ts){
  const d = new Date(ts || Date.now());
  if(d.getHours() < BIZ_CUTOFF_HOUR) d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function bizToday(){ return bizDateOf(Date.now()); }

/* 集計に使う金額は「サービス料・消費税を含まない」もの。
   ＝ SET料金（または初回料金）＋ 指名料 ＋ 同伴料 ＋ 商品（ドリンク等）の合計。
   billHistory の b.sub がこれに当たる（bill() 内で svc・tax を足す前の値）。
   古いバージョンで作られた伝票には無いことがあるので、無ければ total で代用する。 */
const netOf = b => (b && b.sub != null ? b.sub : (b ? (b.total || 0) : 0));

/* 入店時刻（無ければ会計時刻）をもとに営業日で絞り込む */
function billsInRange(fromStr, toStr){
  return (state.billHistory || []).filter(b=>{
    if(!b) return false;
    const bd = bizDateOf(b.seatedAt || b.billedAt || b.at);
    if(fromStr && bd < fromStr) return false;
    if(toStr && bd > toStr) return false;
    return true;
  });
}

function castStats(bills){
  const map = {};
  /* 在籍しているキャストは、その期間に売上が無くても全員載せる（0円のまま一覧に出す） */
  state.casts.forEach(c=>{ map[c.name] = { name:c.name, count:0, nom:0, douhan:0, total:0, active:c.active }; });

  bills.forEach(b=>{
    if(!b) return;
    if(b.isFirst) return;   // 初回料金はお店の売上のみに計上し、送り指名の個人成績には付けない
    const casts = Array.isArray(b.casts) ? b.casts : [];
    (casts.length ? casts : ["（担当なし）"]).forEach(name=>{
      if(!map[name]) map[name] = { name, count:0, nom:0, douhan:0, total:0, active:true };
      const m = map[name];
      m.count++;
      if(b.nom) m.nom++;
      if(b.douhan) m.douhan++;
      m.total += netOf(b);
    });
  });
  // 金額の高い順。同額なら本数が多い方を上に、それも同じなら名前順で安定させる
  return Object.values(map).sort((a,b)=> b.total - a.total || b.count - a.count || a.name.localeCompare(b.name,"ja"));
}
function todayStr(){ return bizToday(); }   // 「今日」は営業日基準（深夜3時まで前日扱い）

/* 今どのクイックボタンが選ばれているかを見た目で示すための判定 */
function rangeMatches(rg, kind){
  const today = todayStr();
  const anchor = new Date(today + "T12:00:00");
  if(kind === "week"){
    const d7 = new Date(anchor); d7.setDate(d7.getDate()-6);
    return rg.from === bizDateOf(d7.getTime()) && rg.to === today;
  }
  if(kind === "month"){
    const d1 = new Date(anchor); d1.setDate(1);
    return rg.from === bizDateOf(d1.getTime()) && rg.to === today;
  }
  return false;
}

/* 売上タブ・伝票タブ共通：今日／直近7日／今月／全期間のプリセットを state[rangeKey] に反映する。
   autoKey は「今日」を選んだときだけ自動追従（日付が変わったら勝手に更新）させるためのフラグ。 */
function applyRangePreset(rangeKey, autoKey, kind){
  const today = todayStr();
  const anchor = new Date(today + "T12:00:00");
  state[autoKey] = (kind === "today");
  if(kind === "today") state[rangeKey] = { from: today, to: today };
  else if(kind === "week"){
    const d7 = new Date(anchor); d7.setDate(d7.getDate()-6);
    state[rangeKey] = { from: bizDateOf(d7.getTime()), to: today };
  } else if(kind === "month"){
    const d1 = new Date(anchor); d1.setDate(1);
    state[rangeKey] = { from: bizDateOf(d1.getTime()), to: today };
  } else if(kind === "all"){
    state[rangeKey] = { from: "", to: "" };
  }
}

function viewSales(){

     開きっぱなしのタブで日をまたいでも、次に描画されたタイミングで
     ちゃんと新しい日の「今日」に切り替わるようにする（週間・月間・自分で日付を
     選んだ場合は salesAuto=false になり、追従を止める）。 */
  if(state.salesAuto === undefined) state.salesAuto = true;
  if(!state.salesRange) state.salesRange = { from: todayStr(), to: todayStr() };
  if(state.salesAuto){
    const t = todayStr();
    if(state.salesRange.from !== t || state.salesRange.to !== t) state.salesRange = { from: t, to: t };
  }
  const rg = state.salesRange;
  const bills = billsInRange(rg.from, rg.to).sort((a,b)=>(b.at||0)-(a.at||0));
  const grand = bills.reduce((s,b)=>s+netOf(b), 0);   // サービス料・消費税を含まない総売上
  const nomCount = bills.filter(b=>b.nom).length, douhanCount = bills.filter(b=>b.douhan).length;
  const firstBills = bills.filter(b=>b.isFirst);

      <input class="inp" type="date" value="${rg.to}" data-sto="1">
      <div class="quick">
        <button data-srange="today" aria-pressed="${rg.from===todayStr()&&rg.to===todayStr()}">今日</button>
        <button data-srange="week" aria-pressed="${rangeMatches(rg,"week")}">直近7日</button>
        <button data-srange="month" aria-pressed="${rangeMatches(rg,"month")}">今月</button>
        <button data-srange="all" aria-pressed="${!rg.from&&!rg.to}">全期間</button>
      </div>
    </div>
    <p class="note" style="margin:-6px 0 14px">${(!rg.from&&!rg.to) ? "現在、全期間を表示しています。" : `現在、<b style="color:var(--gold)">${rg.from===rg.to?rg.from+" のみ":rg.from+" 〜 "+rg.to}</b> を表示しています。`}
      営業日は入店時刻で判定します（深夜3時までの入店は前日の売上）。</p>

    <div class="gtotal"><span>総売上（${bills.length}組）</span><b>${yen(grand)}</b></div>
    <p class="note" style="margin:-8px 0 12px">サービス料・消費税を含まない金額です（SET・指名料・同伴料・商品の合計）。初回料金はお店の売上に含み、送り指名の個人成績には計上しません。</p>
    <div class="summary" style="margin:-2px 0 14px">
      <span class="chip"><span class="n">${nomCount + firstGuests}</span>本 指名</span>
      <span class="chip"><span class="n">${douhanCount}</span>本 同伴</span>
      <span class="chip"><span class="n">${firstBills.length}</span>組 初回</span>
    </div>

    <div class="sec-head"><h2>キャスト別</h2><div class="rule"></div></div>
    ${cs.length ? `<div class="castable">
        <div class="ctr ch"><span>キャスト</span><span>本数</span><span>指名</span><span>同伴</span><span>小計</span></div>
        ${cs.map(c=>`<div class="ctr ${c.total===0?"zero":""}">
          <span>${esc(c.name)}${c.active===false?`<i class="off">退勤</i>`:""}</span><span>${c.count||"—"}</span>
          <span>${c.nom||"—"}</span><span>${c.douhan||"—"}</span>
          <span class="amt">${yen(c.total)}</span></div>`).join("")}
      </div>` : `<div class="empty">キャストが登録されていません。</div>`}

    <div class="sec-head"><h2>初回（お店の売上）</h2><div class="rule"></div></div>
    ${firstBills.length ? `<div class="castable">
          <div class="ctr ch" style="grid-template-columns:1fr 1fr 1fr"><span>組数</span><span>人数</span><span>金額</span></div>
          <div class="ctr" style="grid-template-columns:1fr 1fr 1fr">
            <span>${firstBills.length}組</span>
            <span>${firstGuests}名</span>
            <span class="amt">${yen(firstBills.reduce((s,b)=>s+netOf(b),0))}</span></div>
        </div>
        <p class="note" style="margin-top:6px">送り指名についたキャストの個人成績には含めていません。店舗全体の売上としてのみ計上しています。</p>`
      : `<div class="empty">この期間の初回はありません。</div>`}

    <div class="sec-head"><h2>会計履歴</h2><div class="rule"></div></div>
    ${bills.length ? bills.map(b=>{
        const casts = Array.isArray(b.casts) ? b.casts : [];
        return `<div class="hbatch">
        <div class="hh">${new Date(b.at||Date.now()).toLocaleDateString("ja-JP")} ${hhmmJ(b.at||Date.now())}　${esc(b.tableName||"—")}${

       ${fl.map(l=>`<div class="srow">
          <div class="sn">${l.name}<span>${l.note||""}</span></div>
          <div class="ss">${yen(l.amount)}</div></div>`).join("")}`
    : "";

  const rows = bs.length
    ? bs.map((b,i)=>`<div class="bhead ${(i===0&&!fl.length)?"first":""}">${b.manual?"スタッフ入力":hhmm(b.at)+" の注文"}
          <span>${yen(batchSum(b))}</span></div>
        ${b.lines.map(l=>`<div class="srow">
          <div class="sn">${esc(l.name)}<span>${yen(l.price)}</span></div>
          ${locked ? `<div class="sq">×${l.qty}</div>`
                   : `<div class="sqc">
                        <button data-qty="${tid}:${l.id}:-1">−</button>
                        <span class="q">${l.qty}</span>
                        <button data-qty="${tid}:${l.id}:1">＋</button></div>`}
          <div class="ss">${yen(l.price*l.qty)}</div></div>`).join("")}`).join("")
    : (fl.length ? "" : `<div class="empty" style="margin:0">まだ注文がありません。<br>商品をタップすると伝票に入ります。</div>`);

  let act = "";
  if(t.status==="serving")      act = `<button class="btn warn" data-go="${tid}:billing">会計</button>`;
  else if(t.status==="billing") act = can("manage")
        ? `<button class="btn pri" data-go="${tid}:closed">会計完了</button>`
        : `<p class="note" style="margin:0">会計待ちです。会計完了はホール・管理者が行います。</p>`;
  else if(t.status==="closed")  act = can("manage")
        ? `<button class="btn pri" data-go="${tid}:empty">バッシング完了</button>`
        : `<p class="note" style="margin:0">会計済みです。バッシング完了はホール・管理者が行います。</p>`;
  else act = `<p class="note" style="margin:0">商品をタップすると接客中になります。</p>`;

  return `${stripHtml}
    <div class="orderbar">
      <div class="obt">${esc(t.name)}<span>${S[t.status].label}${t.guests?` ・ ${t.guests}名`:""}</span></div>
      <div class="obtotal">${yen(total)}</div>
    </div>
    <div class="owrap">
      <div>${cartBox}<div class="pgrid">${prods}</div></div>
      <aside class="slip">
        <div class="sec-head" style="margin-top:0"><h2>伝票 ${bs.length?`（${orderCount(tid)}点）`:""}</h2><div class="rule"></div></div>
        ${feeRows}${rows}
        ${totalsBlock(t)}
        <div class="sact">${act}</div>
      </aside>
    </div>`;
}

    <p class="note" style="margin:0 0 18px;font-size:13.5px">${o.msg}</p>

}

function sheetTable(id){
  const t = tableOf(id); if(!t) return;
  const r = rotOf(t.id);
  const rotActive = r && !r.done;

  const nameField = can("manage") ? `<div class="field"><label>お客様名</label>
      <input class="inp" value="${esc(t.customerName||"")}" data-cust="${t.id}" placeholder="お客様名（任意）"></div>` : "";

  const stepper = `<div class="field"><label>人数</label>
      <div class="stepper">
        <button data-guest="${t.id}:-1">−</button>
        <div class="val">${t.guests}<small>名</small></div>
        <button data-guest="${t.id}:1">＋</button>
      </div></div>`;
  const rotField = `<div class="field"><label>初回回し</label>${ rotActive
      ? `<button class="btn wide" data-goto-rot="1">進行中 — ${esc(rounds(r)[r.index].map(castName).join("／"))} を表示</button>`
      : `<button class="btn wide" data-new-rot="${t.id}">この卓で初回を始める</button>`}</div>`;

  const orderField = `<div class="field"><label>伝票</label>
      <button class="btn wide" data-order="${t.id}">${
        (can("order") && t.status!=="closed") ? "注文・伝票" : "伝票を見る"}　${yen(billTotal(t))}</button>
      <button class="btn wide gh" data-receipt="${t.id}" style="margin-top:8px">伝票タブで内訳を見る</button></div>`;

  const act = state.casts.filter(c=>c.active);
  const isFirstNow = t.firstFee !== null && t.firstFee !== undefined;
  const castLabel = isFirstNow ? "送り指名" : "担当キャスト";
  const castField = `<div class="field"><label>${castLabel}${
      (t.casts&&t.casts.length)?`（${t.casts.length}人）`:""}</label>
    ${act.length ? `<div class="castpick">${act.map(c=>{
        const on = (t.casts||[]).includes(c.id);
        return `<button data-tcast="${t.id}:${c.id}" aria-pressed="${on}">${esc(c.name)}</button>`;
      }).join("")}</div>`
    : `<p class="note" style="margin:0">出勤中のキャストがいません。設定から登録してください。</p>`}</div>`;

  const feeField = t.seatedAt ? `<div class="field"><label>料金</label>
      <div class="feegrid">
        ${(t.firstFee !== null && t.firstFee !== undefined) ? `<button class="feebtn" data-firstoff="${t.id}" aria-pressed="true">
          <span class="ck">✓</span>初回料金 <span class="sub">押すと解除</span><b>${yen(t.firstFee)}</b></button>` : ""}
        <button class="feebtn" data-feetog="${t.id}:set" aria-pressed="${t.fees.set}">
          <span class="ck">✓</span>セット料金 <span class="sub">${isFreeTime(t)?"フリータイム":(stayHours(t)?stayHours(t)+"時間経過":"1時間以内")}</span>
          <b>${yen(setFee(t))}</b></button>
        <button class="feebtn" data-feetog="${t.id}:nom" aria-pressed="${t.fees.nom}">
          <span class="ck">✓</span>指名料 <b>${yen(state.fees.nom)}</b></button>
        <button class="feebtn" data-feetog="${t.id}:douhan" aria-pressed="${t.fees.douhan}">
          <span class="ck">✓</span>同伴料 <b>${yen(state.fees.douhan)}</b></button>
      </div></div>` : "";

  let extra = "", main = "", back = "";
  if(t.status === "empty"){
    extra = stepper + rotField;
    main  = `<button class="btn pri big wide" data-go="${t.id}:serving">接客開始</button>`;
  } else if(t.status === "serving"){
    extra = nameField + stepper + castField + feeField + orderField + rotField;
    main  = `<button class="btn warn big wide" data-go="${t.id}:billing">会計</button>`;
    back  = `<button class="btn gh sm" data-go="${t.id}:empty">空席に戻す</button>`;
  } else if(t.status === "billing"){
    extra = nameField + castField + feeField + orderField;
    main  = `<button class="btn pri big wide" data-go="${t.id}:closed">会計完了</button>`;
    back  = `<button class="btn gh sm" data-go="${t.id}:serving">接客中に戻す</button>`;
  } else {
    extra = orderField;
    main  = `<button class="btn pri big wide" data-go="${t.id}:empty">バッシング完了</button>`;
    back  = `<button class="btn gh sm" data-go="${t.id}:billing">会計待ちに戻す</button>`;
  }

  const sub = [];
  if(t.guests > 0) sub.push(`${t.guests}名`);
  if(t.seatedAt && t.status !== "empty") sub.push(`${hhmm(t.seatedAt)} 入店`);

  openSheet(`<h3>${esc(t.name)}${sub.length?`<small>${sub.join(" ・ ")}</small>`:""}</h3>
    <div class="statenow s-${t.status}"><span class="dot"></span>${S[t.status].label}
      <span class="t" data-tick="up:${t.statusSince}"></span></div>
    ${extra}
    ${main}
    <div class="sheet-acts">
      <button class="btn gh" data-closesheet="1">閉じる</button>
      ${back}
    </div>`);
}
